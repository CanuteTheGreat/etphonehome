plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.mikepenz.aboutlibraries.plugin.android'
}

def billingTestHooks = project.findProperty('billingTestHooks') == 'true'
// -PdistChannel=play (publish-play.yml, the Play bundle): no direct-purchase flow at all in that build
// (Play payments policy), even if Android ever misreports the installer. Every other build (the APK on
// errant.solutions / GitHub) sells Pro directly when Google Play didn't install it (docs/PRO-DIRECT.md).
def distChannel = (project.findProperty('distChannel') ?: 'direct').toString()
if (!(distChannel in ['direct', 'play'])) throw new GradleException("distChannel must be direct or play, not ${distChannel}")
// ETPH Pro license keys (docs/PRO-DIRECT.md): PUBLIC Ed25519 keys, committed. Release builds accept
// live keys only; debug/QA builds also the test-mode key (Stripe test purchases).
def proKey = { String mode -> def f = file("pro-license-${mode}.pub"); f.exists() ? f.text.trim() : '' }
def proUrl = { String name, String dflt -> (project.findProperty(name) ?: dflt).toString() }

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.etphonehome'
    compileSdk 36


    defaultConfig {
        // Google Play: "Errant Solutions ETPH" (owner decision 2026-10-18). The Kotlin
        // namespace/package stays com.etphonehome; only the installed app id changed.
        // Builds before 0.7.0 were com.etphonehome, so the new id installs NEXT TO an
        // old sideloaded copy (it cannot replace it); MainActivity points such users
        // at the old app (LegacyApp) so it isn't silently left behind.
        applicationId "solutions.errant.etph"
        minSdk 26
        // Google Play requires targetSdk 36 (Android 16) for new apps. Behaviour changes that
        // apply at 35/36 and how the app handles them: edge-to-edge is enforced, so MainActivity
        // pads its content by the system-bar/cutout/IME insets (EdgeToEdge); predictive back is
        // on by default (the app has no custom back handling, AppCompat routes back itself);
        // TetherService is a specialUse foreground service, which has no Android 15 time limit.
        targetSdk 36
        versionCode 15
        versionName "0.9.3"

        // ETPH Pro (one-time in-app product, owner decision 2026-10-20).
        buildConfigField "String", "PRO_PRODUCT_ID", '"pro"'
        // The app's Play licence key (Play Console > Monetize with Play > Monetization setup >
        // Licensing): the PUBLIC half of the RSA key Play signs every purchase with. Public by
        // design, so it is committed in play-license-key.txt; while that file is missing the app
        // can't check purchase signatures and trusts Google Play's answer as-is (docs/pro.md).
        def licenseKeyFile = file('play-license-key.txt')
        def licenseKey = licenseKeyFile.exists() ? licenseKeyFile.text.replaceAll('\\s', '') : ''
        buildConfigField "String", "PLAY_LICENSE_KEY", "\"${licenseKey}\""
        // -PbillingTestHooks=true (emulator e2e only): enables TestHookReceiver, which forces Free
        // or Pro without Google Play. Off (receiver disabled in the manifest AND the code refuses)
        // in every other build; publish-play.yml refuses a bundle with it enabled.
        buildConfigField "boolean", "BILLING_TEST_HOOKS", "${billingTestHooks}"
        buildConfigField "boolean", "DIRECT_PRO", "${distChannel == 'direct'}"
        buildConfigField "String", "PRO_LICENSE_KEYS", "\"live:${proKey('live')}\""
        // -PproBuyUrl / -PproRevocationUrl: the defaults are the real errant.solutions endpoints.
        buildConfigField "String", "PRO_DIRECT_PRICE", "\"${proUrl('proDirectPrice', 'US$15')}\""
        buildConfigField "String", "PRO_BUY_URL", "\"${proUrl('proBuyUrl', 'https://errant.solutions/etphonehome/pro/')}\""
        buildConfigField "String", "PRO_RECOVER_URL", "\"${proUrl('proRecoverUrl', 'https://errant.solutions/etphonehome/pro/#recover')}\""
        buildConfigField "String", "PRO_REVOCATION_URL", "\"${proUrl('proRevocationUrl', 'https://errant.solutions/api/pro/revocations')}\""
        manifestPlaceholders = [billingTestHooks: billingTestHooks.toString()]

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            buildConfigField "String", "PRO_LICENSE_KEYS", "\"live:${proKey('live')},test:${proKey('test')}\""
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // -PunsignedRelease=true: publish-play.yml builds the Play bundle with NO signing
            // on a normal runner; the dedicated etphonehome-release-signer runner signs it with
            // the upload key after checking its sha256, so that key never reaches a build runner.
            signingConfig project.findProperty('unsignedRelease') == 'true' ? null :
                (hasReleaseSigning ? signingConfigs.release : signingConfigs.debug)
        }
    }

    signingConfigs {
        // Shared, committed debug key (well-known "android" passwords, like
        // the SDK's own). Without it every CI runner signed debug APKs with
        // its own random key, so installing a newer CI artifact over an
        // older one failed with INSTALL_FAILED_UPDATE_INCOMPATIBLE.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseSigning) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packaging {
        // The root-mode helper ships as lib/<abi>/libtun_pipe.so and must be a real file on disk
        // (su execs it from nativeLibraryDir), so the native libs are extracted at install.
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            // Bouncy Castle jars (TLS) each carry these.
            excludes += ['META-INF/versions/*/OSGI-INF/MANIFEST.MF', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    testOptions {
        unitTests.all {
            // Print every test so CI logs prove which tests actually ran.
            testLogging {
                events "passed", "skipped", "failed"
                exceptionFormat "full"
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // enableEdgeToEdge(): same edge-to-edge look and bar contrast on API 26-36.
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'

    // Coroutines for async operations
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Platform-independent core (protocol, session, userspace relay, filter,
    // TLS): android/core, a composite build also run by the CI stand-in.
    implementation 'com.etphonehome:core'

    // Google Play Billing (ETPH Pro one-time purchase). The Java API, not billing-ktx.
    implementation 'com.android.billingclient:billing:9.1.0'

    testImplementation 'junit:junit:4.13.2'
    // Real org.json on the JVM unit-test classpath (android.jar only has stubs) for OpenSourceLicensesTest.
    testImplementation 'org.json:json:20260814'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Open-source licenses screen (OpenSourceLicensesActivity): res/raw/aboutlibraries.json is generated from the
// real dependency graph; aboutlibraries/ adds what Gradle cannot see (the `core` module is ours).
// (property syntax: in Groovy a bare `collect { }` block would be Groovy's own Object.collect, not the extension's)
aboutLibraries.collect.configPath.set(layout.projectDirectory.dir('aboutlibraries'))

// OpenSourceLicensesTest reads the JSON the debug build really generates (the file the screen loads).
['debug', 'release'].each { v ->
    def cap = v.capitalize()
    tasks.matching { it.name == "test${cap}UnitTest" }.configureEach { t ->
        t.dependsOn("prepareLibraryDefinitions${cap}")
        t.systemProperty('oss.aboutlibraries.json',
            layout.buildDirectory.file("generated/aboutLibraries/${v}/res/raw/aboutlibraries.json").get().asFile.absolutePath)
    }
}

// Dependency locking (supply-chain scanning, ci/osv-scan.sh at the repo root): the release runtime classpath is locked
// to app/gradle.lockfile; a drifting resolution fails the build and CI regenerates the file and fails on any diff.
// After changing a dependency: ./gradlew :app:resolveLockedDependencies --write-locks
configurations.matching { it.name == 'releaseRuntimeClasspath' }.configureEach {
    resolutionStrategy.activateDependencyLocking()
}
tasks.register('resolveLockedDependencies') {
    group = 'verification'
    description = 'Resolves the locked releaseRuntimeClasspath (run with --write-locks to refresh gradle.lockfile).'
    notCompatibleWithConfigurationCache('resolves a configuration at execution time')
    def locked = configurations.named('releaseRuntimeClasspath')
    doLast { println("releaseRuntimeClasspath: ${locked.get().incoming.resolutionResult.allComponents.size()} components") }
}
