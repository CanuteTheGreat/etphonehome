name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.forgejo/workflows/android-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.forgejo/workflows/android-ci.yml'

jobs:
  lint:
    name: Lint
    runs-on: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Set up Android SDK
        run: .forgejo/scripts/setup-android-sdk.sh
      - name: Run lint
        working-directory: android
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          export PATH="$PATH:$ANDROID_HOME/platform-tools"
          ./gradlew lint

  test:
    name: Unit Tests
    runs-on: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Set up Android SDK
        run: .forgejo/scripts/setup-android-sdk.sh
      - name: Run unit tests
        working-directory: android
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          export PATH="$PATH:$ANDROID_HOME/platform-tools"
          ./gradlew test

  build:
    name: Build Debug APK
    runs-on: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Set up Android SDK
        run: .forgejo/scripts/setup-android-sdk.sh
      - name: Build debug APK
        working-directory: android
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          export PATH="$PATH:$ANDROID_HOME/platform-tools"
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: etphonehome-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
