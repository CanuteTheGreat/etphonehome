[package]
name = "etphonehome-testpeer"
version = "0.1.0"
edition = "2021"
publish = false
description = "Android-protocol stand-in used by tests and the CI e2e job (not shipped)"

# Part of the workspace so it is built, linted and tested by CI (the e2e job
# runs the real `etphonehome` client against it through a real TUN device).
# It is never part of a release artifact: release builds use `-p`.

[dependencies]
etphonehome-common = { path = "../common" }
tokio = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }

[[bin]]
name = "testpeer"
path = "src/main.rs"

[[bin]]
name = "testclient"
path = "src/bin_client.rs"
