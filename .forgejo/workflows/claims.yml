name: Claims ledger
# Every claim in README.md must map to a CI test that proves it
# (ci/claims.tsv, checked by .forgejo/scripts/check-claims.py). Cheap: runs
# on every push and pull request.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Concurrency (2026-10-17, ctg-infrastructure ollivanders/forgejo/ci-supersede-sweeper):
# other branches and PRs: a new push cancels the older run. main: runs queue behind each
# other instead, so a run that has started is never cancelled by a later push, and the
# sweeper cancels superseded runs that never started (keeps the newest, plus the oldest
# while nothing in the group runs, so constant pushes can't keep main at the back of
# the shared runner queue). Forgejo 17 ignores jobs.<id>.concurrency; only this block counts.
concurrency:
  group: "latest:${{ github.workflow }}@${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  claims:
    name: Every README claim has a test
    runs-on: linux-any  # arch-independent: arm64 or x86 slot, whichever is free (ctg-infrastructure ci-runners)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check ci/claims.tsv
        run: python3 .forgejo/scripts/check-claims.py
      - name: Google Play metadata (store/) matches the app
        run: python3 .forgejo/scripts/check-store-listing.py
      - name: Nothing shipped names the private git host (canutethegreat.com / forgejo)
        run: python3 .forgejo/scripts/check-no-internal-hosts.py
