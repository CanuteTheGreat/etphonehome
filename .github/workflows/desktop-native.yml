# Native macOS and Windows builds + end-to-end tests on GitHub-hosted
# runners (this repo's public GitHub mirror; Forgejo is the source of truth
# and has no macOS/Windows runners). Forgejo ignores .github/workflows
# because .forgejo/workflows exists.
#
# * macOS: universal (Apple Silicon + Intel) CLI + menu-bar app, .pkg,
#   installed and tested on an Apple Silicon AND an Intel Mac: utun, routes,
#   scutil DNS, HTTPS through the phone core, the launchd service + ctl.
# * Windows: the MSI built exactly like the Forgejo release (mingw + wixl on
#   Linux), installed on Windows Server: Wintun adapter, routes, DNS, HTTPS
#   through the phone core, the Windows service + ctl, tray app, uninstall.
# * Tags (v*): the macOS .pkg/.tar.gz are attached to the GitHub release;
#   Forgejo's release workflow copies them into the Forgejo release.
name: Desktop (macOS + Windows, native)

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      # Same paths as .forgejo/workflows/desktop-os.yml, whose gate job
      # waits for this run.
      - 'desktop/**'
      - 'android/core/**'
      - 'protocol/**'
      - '.forgejo/scripts/freebsd-cross-env.sh'
      - '.forgejo/scripts/package.sh'
      - '.forgejo/workflows/desktop-os.yml'
      - '.forgejo/scripts/github-native-gate.py'
      - '.github/workflows/desktop-native.yml'
      - 'store/graphics/icon-512.png'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-native-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  standin:
    name: Phone core (stand-in)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Build
        working-directory: android/core
        run: |
          for attempt in 1 2 3; do
            ../gradlew --no-daemon installDist && break
            [ "$attempt" -eq 3 ] && exit 1
            sleep 20
          done
          tar -C standin/build/install -czf "$GITHUB_WORKSPACE/standin.tar.gz" standin
      - uses: actions/upload-artifact@v4
        with:
          name: standin
          path: standin.tar.gz

  macos-pkg:
    name: macOS package (universal)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then echo "ver=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"; else echo "ver=ci-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"; fi
      - name: Clippy (macOS)
        working-directory: desktop
        run: cargo clippy -p etphonehome-macos -p etphonehome-tray -p etphonehome-common --all-targets -- -D warnings
      - name: Unit tests (macOS)
        working-directory: desktop
        run: cargo test -p etphonehome-common --lib
      - name: Build universal binaries, app bundle and .pkg
        run: bash desktop/packaging/macos/build-pkg.sh "${{ steps.v.outputs.ver }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: etph-macos
          path: dist/
      - name: Attach to the GitHub release (tags)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "ETPH $GITHUB_REF_NAME" --notes "Mirror of https://git.canutethegreat.com/CanuteTheGreat/etphonehome/releases/tag/$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  macos-e2e:
    name: macOS e2e (${{ matrix.os }})
    needs: [standin, macos-pkg]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/download-artifact@v4
        with:
          name: etph-macos
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: standin
      - name: Install and test
        run: |
          tar -xzf standin.tar.gz
          bash desktop/packaging/macos/e2e.sh dist/etph-macos-*.pkg "$PWD/standin"
      - name: Logs
        if: always()
        run: sudo tail -50 /Library/Logs/ETPH/service.log 2>/dev/null || true

  windows-msi:
    name: Windows MSI (mingw + wixl, as released)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64 wixl msitools python3-pil zip unzip
          rustup target add x86_64-pc-windows-gnu
      - name: Build
        working-directory: desktop
        run: cargo build --release --target x86_64-pc-windows-gnu -p etphonehome-windows -p etphonehome-tray
      - name: MSI + zip
        run: bash desktop/packaging/windows/build-msi.sh desktop/target/x86_64-pc-windows-gnu/release "ci-${GITHUB_SHA::8}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: etph-windows
          path: dist/

  windows-e2e:
    name: Windows e2e (Wintun, service, tray)
    needs: [standin, windows-msi]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/download-artifact@v4
        with:
          name: etph-windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: standin
      - name: Install and test
        shell: pwsh
        run: |
          tar -xzf standin.tar.gz
          $msi = (Get-ChildItem dist\etph-windows-*.msi | Select-Object -First 1).FullName
          & desktop\packaging\windows\e2e.ps1 -Msi $msi -Standin "$PWD\standin"
          exit $LASTEXITCODE
      - name: Logs
        if: always()
        shell: pwsh
        run: Get-Content C:\ProgramData\ETPH\service.log -Tail 60 -ErrorAction SilentlyContinue
