name: Rust CI

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'protocol/**'
      - '.forgejo/scripts/desktop-e2e*.sh'
      - '.forgejo/scripts/package.sh'
      - '.forgejo/workflows/rust-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'protocol/**'
      - '.forgejo/scripts/desktop-e2e*.sh'
      - '.forgejo/scripts/package.sh'
      - '.forgejo/workflows/rust-ci.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format Check
    runs-on: linux-cross-x86_64
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        working-directory: desktop
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: fmt
    runs-on: linux-cross-x86_64
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libdbus-1-dev pkg-config
      - name: Ensure Node.js is present (self-heal)
        run: command -v node || sudo apt-get install -y nodejs
      - name: Compute cache key
        id: cachekey
        run: echo "hash=$(find desktop -name Cargo.toml | sort | xargs cat | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: ${{ runner.os }}-cargo-clippy-${{ steps.cachekey.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-
      - name: Run clippy
        working-directory: desktop
        run: cargo clippy --all-targets --all-features -- -D warnings

  audit:
    name: Security Audit
    needs: fmt
    runs-on: linux-cross-x86_64
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libdbus-1-dev pkg-config
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Generate Cargo.lock
        # Cargo.lock is gitignored and never committed in this workspace, so
        # a fresh checkout has nothing for cargo-audit to scan (it errors
        # with "Couldn't load Cargo.lock" rather than silently passing).
        working-directory: desktop
        run: cargo generate-lockfile
      - name: Run cargo audit
        working-directory: desktop
        run: cargo audit

  test:
    name: Test
    needs: [clippy, audit]
    runs-on: linux-cross-x86_64
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libdbus-1-dev pkg-config
      - name: Ensure Node.js is present (self-heal)
        run: command -v node || sudo apt-get install -y nodejs
      - name: Compute cache key
        id: cachekey
        run: echo "hash=$(find desktop -name Cargo.toml | sort | xargs cat | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: ${{ runner.os }}-cargo-test-${{ steps.cachekey.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
      - name: Run tests
        working-directory: desktop
        # --no-fail-fast so one failing crate can't hide the others' results.
        run: cargo test --all --no-fail-fast

  e2e:
    name: End-to-end (real client + TUN + Android stand-in)
    # Runs the release `etphonehome` binary against `testpeer` (speaks the
    # Android app's protocol and TLS) through a real TUN device and pings
    # across the tunnel: WiFi plaintext/TLS, wrong tokens, USB via an adb
    # shim, profile filter rules, auto-reconnect, Ctrl-C disconnect. Also
    # runs the TUN unit tests that need CAP_NET_ADMIN. The job container
    # can't create TUN devices, so desktop-e2e.sh starts a capped sibling
    # container (NET_ADMIN + /dev/net/tun only) via the mounted Docker socket.
    needs: [clippy]
    runs-on: linux-cross-x86_64
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libdbus-1-dev pkg-config
      - name: Ensure Node.js is present (self-heal)
        run: command -v node || sudo apt-get install -y nodejs
      - name: Compute cache key
        id: cachekey
        run: echo "hash=$(find desktop -name Cargo.toml | sort | xargs cat | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: ${{ runner.os }}-cargo-e2e-${{ steps.cachekey.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-cargo-e2e-
      - name: Build client, Android stand-in and privileged tests
        working-directory: desktop
        run: |
          cargo build --release -p etphonehome-linux -p etphonehome-testpeer
          T=$(cargo test -p etphonehome-common --no-run 2>&1 | grep -o 'target/debug/deps/etphonehome_common-[a-z0-9]*' | head -1)
          test -n "$T"
          mkdir -p ../e2e-bin
          cp target/release/etphonehome target/release/testpeer ../e2e-bin/
          cp "$T" ../e2e-bin/common-tests
      - name: Run end-to-end scenarios
        run: bash .forgejo/scripts/desktop-e2e.sh "$PWD/e2e-bin"

  build-linux:
    name: Build Linux
    needs: test
    runs-on: linux-cross-x86_64
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libdbus-1-dev pkg-config
      - name: Ensure Node.js is present (self-heal)
        run: command -v node || sudo apt-get install -y nodejs
      - name: Compute cache key
        id: cachekey
        run: echo "hash=$(find desktop -name Cargo.toml | sort | xargs cat | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: ${{ runner.os }}-cargo-build-${{ steps.cachekey.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-
      - name: Build release
        working-directory: desktop
        run: cargo build --release -p etphonehome-linux
      - name: Package (same script as release.yml) and smoke-test
        run: bash .forgejo/scripts/package.sh linux "ci-${GITHUB_SHA::8}"
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: etphonehome-linux
          # The binary is `etphonehome`; this used to point at a
          # nonexistent `etphonehome-linux`, so nothing was ever uploaded.
          path: dist/etphonehome-linux-*.tar.gz

  build-windows:
    name: Build Windows
    needs: build-linux
    # No windows-latest (or any Windows) runner is registered in this infra —
    # that label silently never picks up a job (stuck "Waiting to run"
    # forever). Cross-compile to Windows via mingw-w64 on the real x86_64
    # runner instead of depending on a nonexistent Windows box.
    runs-on: linux-cross-x86_64
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 zip unzip
      - name: Ensure Node.js is present (self-heal)
        run: command -v node || sudo apt-get install -y nodejs
      - name: Compute cache key
        id: cachekey
        run: echo "hash=$(find desktop -name Cargo.toml | sort | xargs cat | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: ${{ runner.os }}-cargo-build-windows-${{ steps.cachekey.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-windows-
      - name: Build release
        working-directory: desktop
        run: cargo build --release -p etphonehome-windows --target x86_64-pc-windows-gnu
      - name: Package (same script as release.yml)
        run: bash .forgejo/scripts/package.sh windows "ci-${GITHUB_SHA::8}"
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: etphonehome-windows
          # Binary is etphonehome.exe (was pointed at etphonehome-windows.exe).
          path: dist/etphonehome-windows-*.zip

  build-gui:
    name: Build Desktop GUI
    # The GUI crate (desktop/gui, etphonehome-gui) was only ever compiled
    # incidentally as part of `cargo test --all` in the `test` job above --
    # ET Phone Home has shipped a real, actively-developed GUI (iced-based,
    # with its own view/profile/filter-rule editing code and bugfix commits)
    # since the v0.5.0 release, but no CI job ever built it as a standalone
    # binary the way the CLI (etphonehome-linux/etphonehome-windows) gets
    # built here. Add the missing build so a broken GUI-only compile is
    # caught the same way a broken CLI compile would be.
    needs: test
    runs-on: linux-cross-x86_64
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libdbus-1-dev pkg-config
      - name: Ensure Node.js is present (self-heal)
        run: command -v node || sudo apt-get install -y nodejs
      - name: Compute cache key
        id: cachekey
        run: echo "hash=$(find desktop -name Cargo.toml | sort | xargs cat | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: ${{ runner.os }}-cargo-build-gui-${{ steps.cachekey.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-gui-
      - name: Build release
        working-directory: desktop
        run: cargo build --release -p etphonehome-gui
      - name: Package (same script as release.yml)
        run: bash .forgejo/scripts/package.sh gui "ci-${GITHUB_SHA::8}"
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: etphonehome-gui
          path: dist/etphonehome-gui-*.tar.gz
