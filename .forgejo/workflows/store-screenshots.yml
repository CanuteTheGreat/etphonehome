name: Store screenshots (real app, API 36 emulator)
# Phone screenshots for the Play listing, taken from the REAL app on an Android 16 emulator with
# real traffic through it (.forgejo/scripts/store-screenshots.sh). Manual: dispatch, then copy the
# artifact's PNGs to store/graphics/phone/ and push a set-play-listing-<n> tag (play-listing.yml
# uploads store/graphics/ with the listing). Icon + feature graphic: store/graphics/make-graphics.py.

on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: kvm-x86_64
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Keep Node.js on PATH for JS-action steps
        run: |
          command -v node || (sudo apt-get update -qq && sudo apt-get install -y -qq nodejs)
          dirname "$(command -v node)" >> "$GITHUB_PATH"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libdbus-1-dev pkg-config socat iproute2 curl python3 \
            libpulse0 libnss3 libxcomposite1 libxcursor1 libxi6 libxtst6 libasound2 libgl1 libxkbfile1 || \
          sudo apt-get install -y build-essential libdbus-1-dev pkg-config socat iproute2 curl python3 \
            libpulse0 libnss3 libxcomposite1 libxcursor1 libxi6 libxtst6 libasound2t64 libgl1 libxkbfile1
          ls -l /dev/kvm
      - name: Set up Android SDK
        run: .forgejo/scripts/setup-android-sdk.sh
      - name: Build this release APK and the desktop client
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          (cd android && for attempt in 1 2 3; do ./gradlew --no-daemon --max-workers=2 assembleRelease && break; [ "$attempt" -eq 3 ] && exit 1; sleep 20; done; ./gradlew --stop)
          bash .forgejo/scripts/build-linux-release.sh etphonehome-linux etphonehome
          ls -l android/app/build/outputs/apk/release/
      - name: Screenshots
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          APK=$(ls android/app/build/outputs/apk/release/app-release*.apk | head -1)
          bash .forgejo/scripts/store-screenshots.sh "$APK" desktop/target/release/etphonehome store-screenshots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: store-screenshots
          path: store-screenshots/
