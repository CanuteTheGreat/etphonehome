# Native macOS builds + end-to-end tests on GitHub-hosted
# runners (this repo's public GitHub mirror; Forgejo is the source of truth
# and has no macOS runners; Windows runs on our own VM, see below). Forgejo ignores .github/workflows
# because .forgejo/workflows exists.
#
# * macOS: universal (Apple silicon + Intel), macOS 15+ (every version Apple still
#   patches) CLI + menu-bar app, .pkg, installed and tested on xcode-27 (newest, arm64),
#   macos-26-intel (last Intel) and macos-15 (oldest patched, arm64): utun, routes,
#   scutil DNS, HTTPS through the phone core, the launchd service + ctl.
# * Windows: moved to Forgejo (.forgejo/workflows/desktop-windows.yml on our own Windows VM). The GitHub copy is
#   windows-e2e-fallback.yml, workflow_dispatch only.
# * Tags (v*): the macOS .pkg/.tar.gz are attached to the GitHub release;
#   Forgejo's release workflow copies them into the Forgejo release.
name: Desktop (macOS, native)

# Runs ONLY on release tags (v*) and manual dispatch, never on branch pushes:
# GitHub emails the owner (the mirror pushes as his account) about every
# failing run, so fixes are proven locally / in Forgejo's cross-build jobs
# first and this is dispatched only when expected to pass. Never cancel these
# runs. On a tag it attaches the macOS .pkg to the GitHub release, and
# .forgejo/workflows/release.yml (macos-from-github) copies it into the
# Forgejo release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      diagnose:
        description: 'Diagnose only: e2e failures are logged but do not fail the run (no failure email); never for release proof'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-native-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  standin:
    name: Phone core (stand-in)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Build
        working-directory: android/core
        run: |
          for attempt in 1 2 3; do
            ../gradlew --no-daemon installDist && break
            [ "$attempt" -eq 3 ] && exit 1
            sleep 20
          done
          tar -C standin/build/install -czf "$GITHUB_WORKSPACE/standin.tar.gz" standin
      - uses: actions/upload-artifact@v4
        with:
          name: standin
          path: standin.tar.gz

  # Owner rule 2026-10-30: support every macOS version Apple still security-patches (and
  # drop it when Apple stops). Patched today: 15, 26, 27 (support.apple.com/en-us/100100).
  # build-pkg.sh MIN_MACOS=15.0 = deployment target = Info.plist LSMinimumSystemVersion =
  # the pkg's allowed-os-versions. Images: xcode-27 = newest (macOS 27, arm64);
  # macos-26-intel = last Intel macOS; macos-15 = oldest patched, arm64.
  macos-pkg:
    name: macOS package (universal)
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then echo "ver=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"; else echo "ver=ci-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"; fi
      - name: Clippy (macOS)
        working-directory: desktop
        run: cargo clippy -p etphonehome-macos -p etphonehome-tray -p etphonehome-common --all-targets -- -D warnings
      - name: Unit tests (macOS)
        working-directory: desktop
        # macOS 15 "Local Network" privacy blocks multicast for the unprivileged
        # runner user, so the real-mDNS-responder test finds nothing there (it
        # passed as root on macos-15, and on macos-14). Run it as root, the way
        # the launchd service runs; everything else runs as the runner user.
        run: |
          cargo test -p etphonehome-common --lib -- --skip mdns_discovery_finds_advertised_service
          sudo -E env "PATH=$PATH" "HOME=$HOME" cargo test -p etphonehome-common --lib mdns_discovery_finds_advertised_service
      - name: Build universal binaries, app bundle and .pkg
        run: bash desktop/packaging/macos/build-pkg.sh "${{ steps.v.outputs.ver }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: etph-macos
          path: dist/

  macos-e2e:
    name: macOS e2e (${{ matrix.os }})
    needs: [standin, macos-pkg]
    strategy:
      fail-fast: false
      matrix:
        os: [xcode-27, macos-26-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/download-artifact@v4
        with:
          name: etph-macos
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: standin
      - name: Install and test
        continue-on-error: ${{ inputs.diagnose == true }}
        run: |
          tar -xzf standin.tar.gz
          bash desktop/packaging/macos/e2e.sh dist/etph-macos-*.pkg "$PWD/standin"
      - name: Logs
        if: always()
        run: sudo tail -50 /Library/Logs/ETPH/service.log 2>/dev/null || true

  macos-release:
    # Tags only, and only once the .pkg passed e2e on BOTH images: attach it to
    # the GitHub release, where Forgejo's release workflow picks it up
    # (checked against SHA256SUMS-macos-<tag>).
    name: Attach the tested macOS package to the GitHub release (tags)
    if: github.ref_type == 'tag'
    needs: [macos-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: etph-macos
          path: dist
      - name: Attach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          (cd dist && sha256sum -c "SHA256SUMS-macos-$GITHUB_REF_NAME")
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "ETPH $GITHUB_REF_NAME" --notes "Mirror of https://git.canutethegreat.com/CanuteTheGreat/etphonehome/releases/tag/$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" dist/* --clobber
