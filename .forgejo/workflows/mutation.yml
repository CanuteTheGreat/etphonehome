name: Mutation testing (nightly incremental, weekly full)
# Test-quality baseline for the core code: every mutant that survives is a
# behaviour change no test notices. Scores per module are checked against
# ci/mutation-thresholds.json, whose minimums only ever go up.
#   rust    cargo-mutants on desktop/common: wire protocol, session
#           (forwarding, keepalive/idle timeout), cert-pinned TLS, traffic
#           filter, runner (retry policy, routing)
#   kotlin  PIT on android/core: protocol, session, relay, filter, TLS
# Full runs (every mutant, thresholds) on Fridays (UTC) and on demand; the other nights each job
# only mutates what changed since its last green run (cargo-mutants --in-diff / PIT on the changed
# classes, decided by .forgejo/scripts/mutation-incremental.py - canonical copy in
# ctg-infrastructure ci-runners/mutation-incremental) and fails on any new surviving mutant there;
# with no change a job finishes in about a minute without building anything.

on:
  schedule:
    # 10:10 UTC, staggered across the colo lane's day (ctg-infrastructure ci-runners/rw-man-colo)
    - cron: '10 10 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto (full on Fridays, else changed code only), full or incremental'
        required: false
        default: 'auto'

# A newer queued run replaces an older one that has not started (ci-supersede-sweeper,
# replace: groups); a started run is never cancelled.
concurrency:
  group: "replace:${{ github.workflow }}@${{ github.ref }}"
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never

jobs:
  rust:
    name: cargo-mutants (desktop core)
    # shared mutation/chaos lane (x86 slots on rw-man-01..05 since 2026-10-18,
    # ctg-infrastructure ci-runners/README.md); jobs that must stay on colo set CI_COLO_ONLY=1.
    runs-on: mutation-x86_64
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          # the incremental diff starts at the last green run
          fetch-depth: 0
      - name: Refuse on EC2 (colo lane only)
        run: sh .forgejo/scripts/ec2-guard.sh "cargo-mutants"
      - name: Mutation baseline (last green run)
        uses: actions/cache@v4
        with:
          path: .mutation-baseline
          # saved only when the job succeeds; restore-keys picks the newest green baseline
          key: mutation-baseline-rust-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mutation-baseline-rust-
      - name: Full or incremental?
        run: |
          python3 .forgejo/scripts/mutation-incremental.py plan --id rust --full-dow 5 --mode "${{ github.event.inputs.mode }}" \
            --relative desktop -- common/src/protocol.rs common/src/session.rs common/src/tls/certpin.rs common/src/filter.rs common/src/runner.rs
      - name: Install Rust
        if: env.MUT_MODE != 'skip'
        uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Install dependencies
        if: env.MUT_MODE != 'skip'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libdbus-1-dev pkg-config python3
      - name: Install cargo-mutants
        if: env.MUT_MODE != 'skip'
        run: cargo install cargo-mutants --locked
      - name: Mutate the core modules
        if: env.MUT_MODE != 'skip'
        working-directory: desktop
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: |
          # cargo-mutants builds copies of desktop/ in $TMPDIR/cargo-mutants-*;
          # tests include_str! files from outside desktop/ (config.example.toml,
          # protocol/test-vectors.txt, the app's TetherService.kt and
          # accessory_filter.xml, ...), so stage every such include where the
          # copies' relative paths land (found by scanning, not a hand list).
          export TMPDIR="${RUNNER_TEMP:-/tmp}/etph-mutants"
          mkdir -p "$TMPDIR"
          python3 ../.forgejo/scripts/mutants-stage-includes.py "$TMPDIR" || exit 1
          set +e
          diff=""
          [ "$MUT_MODE" = incremental ] && diff="--in-diff $MUT_DIFF"
          cargo mutants --package etphonehome-common --jobs 2 --timeout 120 --no-shuffle $diff \
            --file common/src/protocol.rs --file common/src/session.rs \
            --file common/src/tls/certpin.rs --file common/src/filter.rs \
            --file common/src/runner.rs \
            -- --lib
          rc=$?
          echo "cargo-mutants exit: $rc (2 = some mutants survived, 3 = some timed out; scored below)"
          # 0/2/3 mean the mutants ran; anything else (4 = the unmutated
          # baseline failed, 1 = bad usage) means nothing was measured.
          case $rc in 0|2|3) exit 0 ;; *) exit 1 ;; esac
      - name: Score against ci/mutation-thresholds.json
        if: env.MUT_MODE == 'full'
        run: python3 .forgejo/scripts/mutation-score.py cargo desktop/mutants.out/outcomes.json ci/mutation-thresholds.json
      - name: New survivors in the changed lines / record the baseline
        if: env.MUT_MODE != 'skip'
        run: python3 .forgejo/scripts/mutation-incremental.py gate --id rust --kind cargo --mode "$MUT_MODE" --allow-empty -- desktop/mutants.out
      - name: Upload report
        if: always() && env.MUT_MODE != 'skip'
        uses: actions/upload-artifact@v3
        with:
          name: cargo-mutants
          # Not the per-mutant logs/ directory: ~900 files took the upload
          # longer than the run's interesting part.
          path: |
            desktop/mutants.out/outcomes.json
            desktop/mutants.out/*.txt

  kotlin:
    name: PIT (phone core)
    # shared mutation/chaos lane (x86 slots on rw-man-01..05 since 2026-10-18,
    # ctg-infrastructure ci-runners/README.md); jobs that must stay on colo set CI_COLO_ONLY=1.
    runs-on: mutation-x86_64
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # the incremental diff starts at the last green run
          fetch-depth: 0
      - name: Refuse on EC2 (colo lane only)
        run: sh .forgejo/scripts/ec2-guard.sh "PIT mutation testing"
      - name: Mutation baseline (last green run)
        uses: actions/cache@v4
        with:
          path: .mutation-baseline
          # saved only when the job succeeds; restore-keys picks the newest green baseline
          key: mutation-baseline-kotlin-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mutation-baseline-kotlin-
      - name: Full or incremental?
        run: python3 .forgejo/scripts/mutation-incremental.py plan --id kotlin --kind pit --full-dow 5 --mode "${{ github.event.inputs.mode }}" -- android/core/src/main
      - name: Set up JDK 17
        if: env.MUT_MODE != 'skip'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Mutate the core modules
        if: env.MUT_MODE != 'skip'
        working-directory: android/core
        run: |
          changed=""
          [ "$MUT_MODE" = incremental ] && changed="-PpitChangedClasses=$MUT_TARGETS"
          for attempt in 1 2 3; do
            ../gradlew --no-daemon --max-workers=2 pitest $changed && break
            [ "$attempt" -eq 3 ] && exit 1
            sleep 20
          done
      - name: Score against ci/mutation-thresholds.json
        if: env.MUT_MODE == 'full'
        run: python3 .forgejo/scripts/mutation-score.py pit android/core/build/reports/pitest/mutations.xml ci/mutation-thresholds.json
      - name: New survivors in the changed classes / record the baseline
        if: env.MUT_MODE != 'skip'
        run: python3 .forgejo/scripts/mutation-incremental.py gate --id kotlin --kind pit --mode "$MUT_MODE" --allow-empty --diff "$MUT_DIFF" -- android/core/build/reports/pitest
      - name: Upload report
        if: always() && env.MUT_MODE != 'skip'
        uses: actions/upload-artifact@v3
        with:
          name: pit-report
          path: android/core/build/reports/pitest/
