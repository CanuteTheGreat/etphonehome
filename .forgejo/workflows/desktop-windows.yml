# Windows: the MSI built exactly like the Forgejo release (mingw + wixl on Linux), installed on a real Windows
# Server 2022 and tested end to end: Wintun adapter, routes, DNS, HTTPS through the phone core (stand-in), the Windows
# service + ctl, tray app, upgrade from an older MSI, uninstall.
#
# Runs on OUR Windows VM (rw-man-01, runner label `windows-x86_64`, ctg-infrastructure ci-runners/rw-man-windows). It
# replaces the Windows jobs of .github/workflows/desktop-native.yml (GitHub-hosted minutes: private mirror, Windows 2x);
# those now live in .github/workflows/windows-e2e-fallback.yml as workflow_dispatch-only.
name: Desktop Windows (native e2e)

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'protocol/**'
      - 'android/core/**'
      - '.forgejo/scripts/package.sh'
      - '.forgejo/workflows/desktop-windows.yml'
    tags: ['v*']
  workflow_dispatch:
    inputs:
      diagnose:
        description: 'Diagnose only: e2e failures are logged but do not fail the run; never for release proof'
        type: boolean
        default: false

concurrency:
  group: "latest:${{ github.workflow }}@${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  standin:
    name: Phone core (stand-in)
    runs-on: linux-cross-x86_64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Ensure Node.js is present (self-heal)
        run: command -v node || (sudo apt-get update -qq && sudo apt-get install -y -qq nodejs)
      - name: Build
        working-directory: android/core
        run: |
          for attempt in 1 2 3; do
            ../gradlew --no-daemon installDist && break
            [ "$attempt" -eq 3 ] && exit 1
            sleep 20
          done
          tar -C standin/build/install -czf "$GITHUB_WORKSPACE/standin.tar.gz" standin
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: standin
          path: standin.tar.gz

  windows-msi:
    name: Windows MSI (mingw + wixl, as released)
    runs-on: linux-cross-x86_64
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64 wixl msitools python3-pil zip unzip
          command -v node || sudo apt-get install -y -qq nodejs
      - name: Build
        working-directory: desktop
        run: cargo build --release --target x86_64-pc-windows-gnu -p etphonehome-windows -p etphonehome-tray
      - name: MSI + zip
        run: |
          bash desktop/packaging/windows/build-msi.sh desktop/target/x86_64-pc-windows-gnu/release "ci-${GITHUB_SHA::8}" dist
          # An "older release" for the upgrade test (same files, version 0.0.1).
          bash desktop/packaging/windows/build-msi.sh desktop/target/x86_64-pc-windows-gnu/release v0.0.1 old
          mv old/etph-windows-v0.0.1.msi dist/upgrade-from-v0.0.1.msi
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: etph-windows
          path: dist/

  windows-e2e:
    name: Windows e2e (Wintun, service, tray)
    needs: [standin, windows-msi]
    runs-on: windows-x86_64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          name: etph-windows
          path: dist
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          name: standin
      - name: Install and test
        shell: pwsh
        env:
          DIAGNOSE: ${{ inputs.diagnose }}
        run: |
          $env:RUNNER_TEMP = 'C:\ci\work\runner-temp'
          New-Item -ItemType Directory -Force $env:RUNNER_TEMP | Out-Null
          tar -xzf standin.tar.gz
          $msi = (Get-ChildItem dist\etph-windows-*.msi | Select-Object -First 1).FullName
          & desktop\packaging\windows\e2e.ps1 -Msi $msi -Standin "$PWD\standin" -OldMsi "$PWD\dist\upgrade-from-v0.0.1.msi" *>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath e2e-out.txt
          $code = $LASTEXITCODE
          $p = @(Select-String -Path e2e-out.txt -Pattern '^PASS:').Count; $f = @(Select-String -Path e2e-out.txt -Pattern '^FAIL:').Count
          "WINDOWS-E2E-COUNTS pass=$p fail=$f"
          if ($env:DIAGNOSE -eq 'true') { exit 0 }   # diagnose: failures are logged, not fatal; never for release proof
          exit $code
      - name: Logs
        if: always()
        shell: pwsh
        run: Get-Content C:\ProgramData\ETPH\service.log -Tail 60 -ErrorAction SilentlyContinue
