name: Android CI
# retrigger2: x86_64 label pinned to amd64 digest
# retrigger: container.options now sets --platform=linux/amd64
# retrigger: beauxbatons x86_64 label now runs under --platform=linux/amd64
# fix(2026-10-08): switched lint/test/build from x86_64 (QEMU-emulated amd64
# on beauxbatons, Apple Silicon host) to arm64 (native docker, no emulation).
# x86_64 jobs were failing every run with "node: executable file not found in
# $PATH" mid-job (setup-gradle's post step onward) -- classic QEMU user-mode
# exec flakiness, not a workflow bug. Android/Gradle builds are host-arch
# agnostic so arm64 is safe here.

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.forgejo/workflows/android-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.forgejo/workflows/android-ci.yml'

jobs:
  lint:
    name: Lint
    runs-on: arm64
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Set up Android SDK
        run: .forgejo/scripts/setup-android-sdk.sh
      - name: Run lint
        working-directory: android
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          export PATH="$PATH:$ANDROID_HOME/platform-tools"
          ./gradlew lint

  test:
    name: Unit Tests
    runs-on: arm64
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Set up Android SDK
        run: .forgejo/scripts/setup-android-sdk.sh
      - name: Run unit tests
        working-directory: android
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          export PATH="$PATH:$ANDROID_HOME/platform-tools"
          ./gradlew test

  build:
    name: Build Debug APK
    runs-on: arm64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Set up Android SDK
        run: .forgejo/scripts/setup-android-sdk.sh
      - name: Build debug APK
        working-directory: android
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          export PATH="$PATH:$ANDROID_HOME/platform-tools"
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: etphonehome-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
