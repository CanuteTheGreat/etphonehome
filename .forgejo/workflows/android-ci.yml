name: Android CI
# retrigger2: x86_64 label pinned to amd64 digest
# retrigger: container.options now sets --platform=linux/amd64
# retrigger: beauxbatons x86_64 label now runs under --platform=linux/amd64
# fix(2026-10-08): dropped gradle/actions/setup-gradle@v3. Every job was
# failing 100% of the time (confirmed after a runner daemon restart, so not
# QEMU flakiness) with 'node: executable file not found in $PATH' exactly at
# that action's main step -- it's fetched via a different git-clone path than
# actions/checkout and actions/setup-java (which both exec node fine right
# before and after it in the same job/container), pointing at a broken or
# uncached bundle for this specific action on the beauxbatons runner. It only
# provided Gradle dependency caching, not required for correctness -- gradlew
# runs fine without it, so removing it unblocks CI without needing a runner
# infra change.

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'protocol/**'
      - '.forgejo/scripts/package.sh'
      - '.forgejo/workflows/android-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'protocol/**'
      - '.forgejo/scripts/package.sh'
      - '.forgejo/workflows/android-ci.yml'

jobs:
  lint:
    name: Lint
    runs-on: linux-cross-x86_64
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Android SDK
        run: .forgejo/scripts/setup-android-sdk.sh
      - name: Run lint
        working-directory: android
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          export PATH="$PATH:$ANDROID_HOME/platform-tools"
          # Retry on transient Maven Central/dl.google.com dependency-resolution
          # flakes (confirmed on beauxbatons, see LIVE-STATUS.md 2026-10-10/10-11 --
          # "Could not GET '.../repo.maven.apache.org/...'" with no code change
          # involved and the identical dep set succeeding moments earlier/later).
          for attempt in 1 2 3; do
            ./gradlew lint && break
            if [ "$attempt" -eq 3 ]; then
              echo "gradlew lint failed after 3 attempts"
              exit 1
            fi
            echo "gradlew lint failed (attempt $attempt/3), retrying in 20s..."
            sleep 20
          done

  test:
    name: Unit Tests
    runs-on: linux-cross-x86_64
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Android SDK
        run: .forgejo/scripts/setup-android-sdk.sh
      - name: Run unit tests
        working-directory: android
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          export PATH="$PATH:$ANDROID_HOME/platform-tools"
          # Retry on transient Maven Central/dl.google.com dependency-resolution
          # flakes (see lint job above and LIVE-STATUS.md 2026-10-10/10-11).
          for attempt in 1 2 3; do
            ./gradlew test && (cd core && ../gradlew test) && break
            if [ "$attempt" -eq 3 ]; then
              echo "gradlew test failed after 3 attempts"
              exit 1
            fi
            echo "gradlew test failed (attempt $attempt/3), retrying in 20s..."
            sleep 20
          done

  build:
    name: Build Debug APK
    runs-on: linux-cross-x86_64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Upload APK (a Node action) failed with exit 127 "command not found"
      # on ba6a10a: a later step rewrites the PATH used for JS actions and
      # drops node. Pin the container's node directory first.
      - name: Keep Node.js on PATH for JS-action steps
        run: |
          command -v node || (sudo apt-get update -qq && sudo apt-get install -y -qq nodejs)
          dirname "$(command -v node)" >> "$GITHUB_PATH"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Android SDK
        run: .forgejo/scripts/setup-android-sdk.sh
      - name: Build debug APK
        working-directory: android
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          export PATH="$PATH:$ANDROID_HOME/platform-tools"
          # Retry on transient Maven Central/dl.google.com dependency-resolution
          # flakes -- confirmed twice now (LIVE-STATUS.md 2026-10-10/10-11, run 75
          # on commit 927739b both times, same commit/same unchanged dep set):
          # "Could not resolve org.jetbrains.kotlin:kotlin-stdlib:2.0.21" / etc.,
          # all failing with "Could not GET '.../repo.maven.apache.org/...'" --
          # a runner-side network/DNS blip, not a real dependency problem.
          for attempt in 1 2 3; do
            # assembleRelease too, so the release.yml packaging path (and
            # its APK naming) is exercised on every push, not only on tags.
            ./gradlew assembleDebug assembleRelease && break
            if [ "$attempt" -eq 3 ]; then
              echo "gradlew assemble failed after 3 attempts"
              exit 1
            fi
            echo "gradlew assembleDebug failed (attempt $attempt/3), retrying in 20s..."
            sleep 20
          done
          # Stop the Gradle daemon immediately: it was left holding enough
          # container memory after a full assembleDebug that the very next
          # step's node-based action (actions/upload-artifact) would fail
          # its docker exec with "node: executable file not found in $PATH"
          # -- a resource-starvation symptom, not a missing binary.
          ./gradlew --stop
      - name: Package release APK (same script as release.yml)
        run: bash .forgejo/scripts/package.sh android "ci-${GITHUB_SHA::8}"
      - name: Upload APK
        # continue-on-error: this step is a Node-based action and the one
        # most likely to hit the documented beauxbatons Docker Desktop VM
        # memory ceiling right after a full assembleDebug (see comments
        # above and LIVE-STATUS.md 2026-10-08 entries -- "node: executable
        # file not found in $PATH" under memory pressure, not a real bug).
        # The debug APK artifact is convenience-only (no downstream job or
        # release pipeline consumes it), so a failure here must not fail
        # the job when the actual build (assembleDebug, the step that
        # matters) already succeeded.
        continue-on-error: true
        uses: actions/upload-artifact@v3
        with:
          name: etphonehome-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
