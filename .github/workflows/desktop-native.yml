# Native macOS and Windows builds + end-to-end tests on GitHub-hosted
# runners (this repo's public GitHub mirror; Forgejo is the source of truth
# and has no macOS/Windows runners). Forgejo ignores .github/workflows
# because .forgejo/workflows exists.
#
# * macOS: universal (Apple Silicon + Intel) CLI + menu-bar app, .pkg,
#   installed and tested on an Apple Silicon AND an Intel Mac: utun, routes,
#   scutil DNS, HTTPS through the phone core, the launchd service + ctl.
# * Windows: the MSI built exactly like the Forgejo release (mingw + wixl on
#   Linux), installed on Windows Server: Wintun adapter, routes, DNS, HTTPS
#   through the phone core, the Windows service + ctl, tray app, uninstall.
# * Tags (v*): the macOS .pkg/.tar.gz are attached to the GitHub release;
#   Forgejo's release workflow copies them into the Forgejo release.
name: Desktop (macOS + Windows, native)

# Runs ONLY on release tags (v*) and manual dispatch, never on branch pushes:
# GitHub emails the owner (the mirror pushes as his account) about every
# failing run, so fixes are proven locally / in Forgejo's cross-build jobs
# first and this is dispatched only when expected to pass. Never cancel these
# runs. On a tag it attaches the macOS .pkg to the GitHub release, and
# .forgejo/workflows/release.yml (macos-from-github) copies it into the
# Forgejo release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      diagnose:
        description: 'Diagnose only: e2e failures are logged but do not fail the run (no failure email); never for release proof'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-native-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  standin:
    name: Phone core (stand-in)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Build
        working-directory: android/core
        run: |
          for attempt in 1 2 3; do
            ../gradlew --no-daemon installDist && break
            [ "$attempt" -eq 3 ] && exit 1
            sleep 20
          done
          tar -C standin/build/install -czf "$GITHUB_WORKSPACE/standin.tar.gz" standin
      - uses: actions/upload-artifact@v4
        with:
          name: standin
          path: standin.tar.gz

  # macos-14 is retired by GitHub on 2026-11-02 (changelog 2026-10-01). Runner labels
  # (README of actions/runner-images, 2026-10-30): xcode-27 = newest GA image (macOS 27,
  # arm64 only, GA 2026-10-15); macos-26-intel = newest image with an Intel variant;
  # macos-15 = oldest arm64 image still offered. Deployment target 11.0 (build-pkg.sh,
  # Info.plist LSMinimumSystemVersion, README "macOS 11+"): the oldest image proves it.
  macos-pkg:
    name: macOS package (universal)
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then echo "ver=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"; else echo "ver=ci-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"; fi
      - name: Clippy (macOS)
        working-directory: desktop
        run: cargo clippy -p etphonehome-macos -p etphonehome-tray -p etphonehome-common --all-targets -- -D warnings
      - name: Unit tests (macOS)
        working-directory: desktop
        # macOS 15 "Local Network" privacy blocks multicast for the unprivileged
        # runner user, so the real-mDNS-responder test finds nothing there (it
        # passed as root on macos-15, and on macos-14). Run it as root, the way
        # the launchd service runs; everything else runs as the runner user.
        run: |
          cargo test -p etphonehome-common --lib -- --skip mdns_discovery_finds_advertised_service
          sudo -E env "PATH=$PATH" "HOME=$HOME" cargo test -p etphonehome-common --lib mdns_discovery_finds_advertised_service
      - name: Build universal binaries, app bundle and .pkg
        run: bash desktop/packaging/macos/build-pkg.sh "${{ steps.v.outputs.ver }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: etph-macos
          path: dist/

  macos-e2e:
    name: macOS e2e (${{ matrix.os }})
    needs: [standin, macos-pkg]
    strategy:
      fail-fast: false
      matrix:
        os: [xcode-27, macos-26-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/download-artifact@v4
        with:
          name: etph-macos
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: standin
      - name: Install and test
        continue-on-error: ${{ inputs.diagnose == true }}
        run: |
          tar -xzf standin.tar.gz
          bash desktop/packaging/macos/e2e.sh dist/etph-macos-*.pkg "$PWD/standin"
      - name: Logs
        if: always()
        run: sudo tail -50 /Library/Logs/ETPH/service.log 2>/dev/null || true

  macos-release:
    # Tags only, and only once the .pkg passed e2e on BOTH Macs: attach it to
    # the GitHub release, where Forgejo's release workflow picks it up
    # (checked against SHA256SUMS-macos-<tag>).
    name: Attach the tested macOS package to the GitHub release (tags)
    if: github.ref_type == 'tag'
    needs: [macos-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: etph-macos
          path: dist
      - name: Attach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          (cd dist && sha256sum -c "SHA256SUMS-macos-$GITHUB_REF_NAME")
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "ETPH $GITHUB_REF_NAME" --notes "Mirror of https://git.canutethegreat.com/CanuteTheGreat/etphonehome/releases/tag/$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" dist/* --clobber

  windows-msi:
    name: Windows MSI (mingw + wixl, as released)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64 wixl msitools python3-pil zip unzip
          rustup target add x86_64-pc-windows-gnu
      - name: Build
        working-directory: desktop
        run: cargo build --release --target x86_64-pc-windows-gnu -p etphonehome-windows -p etphonehome-tray
      - name: MSI + zip
        run: |
          bash desktop/packaging/windows/build-msi.sh desktop/target/x86_64-pc-windows-gnu/release "ci-${GITHUB_SHA::8}" dist
          # An "older release" for the upgrade test (same files, version 0.0.1).
          bash desktop/packaging/windows/build-msi.sh desktop/target/x86_64-pc-windows-gnu/release v0.0.1 old
          mv old/etph-windows-v0.0.1.msi dist/upgrade-from-v0.0.1.msi
      - uses: actions/upload-artifact@v4
        with:
          name: etph-windows
          path: dist/

  windows-e2e:
    name: Windows e2e (Wintun, service, tray)
    needs: [standin, windows-msi]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/download-artifact@v4
        with:
          name: etph-windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: standin
      - name: Install and test
        continue-on-error: ${{ inputs.diagnose == true }}
        shell: pwsh
        run: |
          tar -xzf standin.tar.gz
          $msi = (Get-ChildItem dist\etph-windows-*.msi | Select-Object -First 1).FullName
          & desktop\packaging\windows\e2e.ps1 -Msi $msi -Standin "$PWD\standin" -OldMsi "$PWD\dist\upgrade-from-v0.0.1.msi"
          exit $LASTEXITCODE
      - name: Logs
        if: always()
        shell: pwsh
        run: Get-Content C:\ProgramData\ETPH\service.log -Tail 60 -ErrorAction SilentlyContinue
