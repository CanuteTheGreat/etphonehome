# FALLBACK ONLY (2026-10-30): the real Windows e2e is .forgejo/workflows/desktop-windows.yml on our own Windows VM
# (rw-man-01, runner label windows-x86_64; ctg-infrastructure ci-runners/rw-man-windows). Dispatch THIS one only if that VM
# is down: GitHub-hosted Windows minutes count 2x on the private account and its included minutes are nearly used up.
# workflow_dispatch ONLY, never on push/tag (a failing run emails the owner).
name: Windows e2e (GitHub fallback)

on:
  workflow_dispatch:
    inputs:
      diagnose:
        description: 'Diagnose only: e2e failures are logged but do not fail the run (no failure email); never for release proof'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-e2e-fallback-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  standin:
    name: Phone core (stand-in)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Build
        working-directory: android/core
        run: |
          for attempt in 1 2 3; do
            ../gradlew --no-daemon installDist && break
            [ "$attempt" -eq 3 ] && exit 1
            sleep 20
          done
          tar -C standin/build/install -czf "$GITHUB_WORKSPACE/standin.tar.gz" standin
      - uses: actions/upload-artifact@v4
        with:
          name: standin
          path: standin.tar.gz

  windows-msi:
    name: Windows MSI (mingw + wixl, as released)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64 wixl msitools python3-pil zip unzip
          rustup target add x86_64-pc-windows-gnu
      - name: Build
        working-directory: desktop
        run: cargo build --release --target x86_64-pc-windows-gnu -p etphonehome-windows -p etphonehome-tray
      - name: MSI + zip
        run: |
          bash desktop/packaging/windows/build-msi.sh desktop/target/x86_64-pc-windows-gnu/release "ci-${GITHUB_SHA::8}" dist
          # An "older release" for the upgrade test (same files, version 0.0.1).
          bash desktop/packaging/windows/build-msi.sh desktop/target/x86_64-pc-windows-gnu/release v0.0.1 old
          mv old/etph-windows-v0.0.1.msi dist/upgrade-from-v0.0.1.msi
      - uses: actions/upload-artifact@v4
        with:
          name: etph-windows
          path: dist/

  windows-e2e:
    name: Windows e2e (Wintun, service, tray)
    needs: [standin, windows-msi]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/download-artifact@v4
        with:
          name: etph-windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: standin
      - name: Install and test
        continue-on-error: ${{ inputs.diagnose == true }}
        shell: pwsh
        run: |
          tar -xzf standin.tar.gz
          $msi = (Get-ChildItem dist\etph-windows-*.msi | Select-Object -First 1).FullName
          & desktop\packaging\windows\e2e.ps1 -Msi $msi -Standin "$PWD\standin" -OldMsi "$PWD\dist\upgrade-from-v0.0.1.msi"
          exit $LASTEXITCODE
      - name: Logs
        if: always()
        shell: pwsh
        run: Get-Content C:\ProgramData\ETPH\service.log -Tail 60 -ErrorAction SilentlyContinue
