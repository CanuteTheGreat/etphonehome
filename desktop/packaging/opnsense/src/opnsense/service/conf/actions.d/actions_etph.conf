[start]
command:/usr/local/etc/rc.d/etphonehome start
parameters:
type:script
message:starting ETPH

[stop]
command:/usr/local/etc/rc.d/etphonehome stop
parameters:
type:script
message:stopping ETPH

[restart]
command:/usr/local/etc/rc.d/etphonehome restart
parameters:
type:script
message:restarting ETPH

[status]
command:/usr/local/etc/rc.d/etphonehome status; exit 0
parameters:
type:script_output
message:requesting ETPH status

[phone]
command:cat /var/run/etph/etph0.json 2>/dev/null || echo '{"state":"stopped"}'
parameters:
type:script_output
message:requesting ETPH phone status
