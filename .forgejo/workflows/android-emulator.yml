name: Android emulator (real app, real internet)
# The real APK on Android emulators (KVM, rw-man-01): UI-started USB and WiFi
# TLS sessions giving a desktop real internet, app killed / Stop button
# recovery, the phone keeping its own connectivity, and an in-place upgrade
# from the previous release. API 26 = the app's minSdk, API 36 = targetSdk (Android 16,
# edge-to-edge and predictive back enforced), API 34 = the last version before those.
# See .forgejo/scripts/android-emulator-e2e.sh.

on:
  schedule:
    - cron: '47 11 * * *'
  workflow_dispatch:

jobs:
  emulator:
    name: Real app on emulators (API 26 + 34 + 36)
    runs-on: kvm-x86_64
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Keep Node.js on PATH for JS-action steps
        run: |
          command -v node || (sudo apt-get update -qq && sudo apt-get install -y -qq nodejs)
          dirname "$(command -v node)" >> "$GITHUB_PATH"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libdbus-1-dev pkg-config socat iproute2 curl python3 \
            libpulse0 libnss3 libxcomposite1 libxcursor1 libxi6 libxtst6 libasound2 libgl1 libxkbfile1 || \
          sudo apt-get install -y build-essential libdbus-1-dev pkg-config socat iproute2 curl python3 \
            libpulse0 libnss3 libxcomposite1 libxcursor1 libxi6 libxtst6 libasound2t64 libgl1 libxkbfile1
          ls -l /dev/kvm
      - name: Set up Android SDK
        run: .forgejo/scripts/setup-android-sdk.sh
      - name: Build this release APK and the desktop client
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          (cd android && for attempt in 1 2 3; do ./gradlew --no-daemon --max-workers=2 assembleRelease && break; [ "$attempt" -eq 3 ] && exit 1; sleep 20; done; ./gradlew --stop)
          bash .forgejo/scripts/build-linux-release.sh etphonehome-linux etphonehome
          ls -l android/app/build/outputs/apk/release/
      - name: Previous release APK
        run: |
          API=${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}
          curl -fsS "$API/releases?limit=5" -o releases.json
          URL=$(python3 -c "
          import json
          r=[r for r in json.load(open('releases.json')) if not r['draft'] and not r['prerelease']][0]
          print([a['browser_download_url'] for a in r['assets'] if a['name'].endswith('.apk')][0])")
          echo "previous APK: $URL"
          curl -fsSL "$URL" -o prev.apk
          # Releases since 0.7.0 are signed with the ETPH release key, which never reaches this
          # runner (only etphonehome-release-signer has it; sign-apk.sh enforces the cert there),
          # while this run's build carries the committed CI key. Android refuses an upgrade across
          # keys, so re-sign the previous release with the CI key: the upgrade check then tests
          # what it is for (same app id, newer versionCode, data and pairing token kept).
          export ANDROID_HOME="$HOME/android-sdk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          python3 - prev.apk prev-unsigned.apk <<'PY'
          import re, sys, zipfile
          src, dst = zipfile.ZipFile(sys.argv[1]), zipfile.ZipFile(sys.argv[2], "w")
          for i in src.infolist():
              if re.fullmatch(r"META-INF/([^/]+\.(SF|RSA|DSA|EC)|MANIFEST\.MF)", i.filename):
                  continue
              dst.writestr(i, src.read(i.filename))
          dst.close()
          PY
          "$BT/zipalign" -p -f 4 prev-unsigned.apk prev-aligned.apk
          "$BT/apksigner" sign --ks android/app/debug.keystore --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias androiddebugkey --out prev.apk prev-aligned.apk
          "$BT/apksigner" verify --print-certs prev.apk | grep -m1 'SHA-256'
      - name: API 36 (targetSdk, Android 16) -- with the upgrade from the previous release
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          APK=$(ls android/app/build/outputs/apk/release/app-release*.apk | head -1)
          bash .forgejo/scripts/android-emulator-e2e.sh 36 google_apis "$APK" desktop/target/release/etphonehome prev.apk
      - name: API 34 (Android 14)
        if: always()
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          APK=$(ls android/app/build/outputs/apk/release/app-release*.apk | head -1)
          bash .forgejo/scripts/android-emulator-e2e.sh 34 google_apis "$APK" desktop/target/release/etphonehome
      - name: API 26 (minSdk, Android 8.0)
        if: always()
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          APK=$(ls android/app/build/outputs/apk/release/app-release*.apk | head -1)
          bash .forgejo/scripts/android-emulator-e2e.sh 26 default "$APK" desktop/target/release/etphonehome
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: emulator-results
          path: emulator-results/
