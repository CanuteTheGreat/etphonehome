name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux Release
    runs-on: linux-cross-x86_64
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Build release
        working-directory: desktop
        run: cargo build --release -p etphonehome-linux
      - name: Package
        # Same script the per-push Rust CI build job runs, so this path is
        # exercised on every push (it used to strip/tar a nonexistent
        # `etphonehome-linux` file and fail).
        run: bash .forgejo/scripts/package.sh linux "${{ github.ref_name }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: etphonehome-linux-${{ github.ref_name }}
          path: dist/etphonehome-linux-${{ github.ref_name }}.tar.gz

  build-windows:
    name: Build Windows Release
    # No windows-latest runner exists in this infra — cross-compile via
    # mingw-w64 on the real x86_64 runner (same fix as rust-ci.yml).
    runs-on: linux-cross-x86_64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install mingw-w64 and zip
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 zip unzip
      - name: Build release
        working-directory: desktop
        run: cargo build --release -p etphonehome-windows --target x86_64-pc-windows-gnu
      - name: Package
        run: bash .forgejo/scripts/package.sh windows "${{ github.ref_name }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: etphonehome-windows-${{ github.ref_name }}
          path: dist/etphonehome-windows-${{ github.ref_name }}.zip

  build-gui-linux:
    name: Build Desktop GUI (Linux)
    # Previously the GUI crate (etphonehome-gui) was never packaged into a
    # release at all -- only the CLI binaries (etphonehome-linux,
    # etphonehome-windows) shipped, even though the GUI is a real, actively
    # maintained feature (part of the v0.5.0 "GUI, TLS, filtering, root mode"
    # release and still getting bugfixes). Ship it like the CLI.
    runs-on: linux-cross-x86_64
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Build release
        working-directory: desktop
        run: cargo build --release -p etphonehome-gui
      - name: Package
        run: bash .forgejo/scripts/package.sh gui "${{ github.ref_name }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: etphonehome-gui-${{ github.ref_name }}
          path: dist/etphonehome-gui-${{ github.ref_name }}.tar.gz

  build-android:
    name: Build Android Release
    runs-on: linux-cross-x86_64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      # (gradle/actions/setup-gradle@v3 removed: it fails on this runner with
      # "node: executable file not found", see android-ci.yml.)
      - name: Set up Android SDK
        run: .forgejo/scripts/setup-android-sdk.sh
      - name: Build release APK
        working-directory: android
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          export PATH="$PATH:$ANDROID_HOME/platform-tools"
          ./gradlew assembleRelease
      - name: Package
        # Release builds are signed (release key, or the debug key as a
        # fallback), so the APK is app-release.apk, never
        # app-release-unsigned.apk as this step used to assume.
        run: bash .forgejo/scripts/package.sh android "${{ github.ref_name }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: etphonehome-android-${{ github.ref_name }}
          path: dist/etphonehome-${{ github.ref_name }}.apk

  create-release:
    name: Publish Forgejo release
    # softprops/action-gh-release only speaks GitHub's API, so no release was
    # ever created here. This talks to the Forgejo releases API directly:
    # create (or reuse) the release for the tag, upload every package, then
    # verify the release really lists all four.
    needs: [build-linux, build-windows, build-gui-linux, build-android]
    runs-on: linux-cross-x86_64
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the versions the packages carry
        run: |
          TAG="${{ github.ref_name }}"
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' desktop/Cargo.toml | head -1)
          APK=$(sed -n 's/.*versionName "\(.*\)"/\1/p' android/app/build.gradle | head -1)
          echo "tag=$TAG cargo=$CARGO android=$APK"
          test "$TAG" = "v$CARGO"
          test "$TAG" = "v$APK"
          grep -q "## \[$CARGO\]" CHANGELOG.md
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts
      - name: Create release and upload packages
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VER=${TAG#v}
          # Release notes = this version's CHANGELOG section.
          awk -v v="$VER" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          PRE=false
          case "$TAG" in *alpha*|*beta*|*rc*) PRE=true ;; esac
          BODY=$(python3 -c 'import json,sys; print(json.dumps({"tag_name": sys.argv[1], "name": "ET Phone Home " + sys.argv[1], "body": open("notes.md").read(), "draft": False, "prerelease": sys.argv[2] == "true"}))' "$TAG" "$PRE")
          auth=(-H "Authorization: token $TOKEN")
          CODE=$(curl -sS -o rel.json -w '%{http_code}' "${auth[@]}" -H 'Content-Type: application/json' -X POST "$API/releases" -d "$BODY")
          if [ "$CODE" != 201 ]; then
            echo "create returned $CODE: $(cat rel.json)"
            curl -fsS "${auth[@]}" "$API/releases/tags/$TAG" -o rel.json
          fi
          ID=$(python3 -c 'import json; print(json.load(open("rel.json"))["id"])')
          echo "release id $ID"
          for f in artifacts/*/*; do
            name=$(basename "$f")
            # Re-runs replace an asset of the same name.
            OLD=$(curl -fsS "${auth[@]}" "$API/releases/$ID/assets" | python3 -c 'import json,sys; n=sys.argv[1]; print(" ".join(str(a["id"]) for a in json.load(sys.stdin) if a["name"]==n))' "$name")
            for a in $OLD; do curl -fsS "${auth[@]}" -X DELETE "$API/releases/$ID/assets/$a"; done
            echo "uploading $name ($(stat -c %s "$f") bytes)"
            curl -fsS "${auth[@]}" -X POST "$API/releases/$ID/assets?name=$name" -F "attachment=@$f" >/dev/null
          done
      - name: Verify the published release
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          curl -fsS -H "Authorization: token $TOKEN" "$API/releases/tags/$TAG" | python3 -c '
          import json, sys
          r = json.load(sys.stdin)
          names = sorted(a["name"] for a in r["assets"])
          print(r["html_url"]); print("\n".join(names))
          tag = r["tag_name"]
          want = {f"etphonehome-linux-{tag}.tar.gz", f"etphonehome-windows-{tag}.zip", f"etphonehome-gui-{tag}.tar.gz", f"etphonehome-{tag}.apk"}
          missing = want - set(names)
          assert not missing, f"missing assets: {missing}"
          assert not r["draft"], "release is a draft"
          '
