plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.0.21'
    id 'java-library'
}

group = 'com.etphonehome'
version = '0.6.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    api 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    // TLS 1.3 server with the desktop's token-derived Ed25519 certificate
    // pinning (desktop/common/src/tls/certpin.rs). Android's platform TLS
    // (Conscrypt) cannot use Ed25519 keys, so the app ships Bouncy Castle's
    // JSSE provider (MIT-style Bouncy Castle licence).
    api 'org.bouncycastle:bcprov-jdk18on:1.86'
    api 'org.bouncycastle:bcpkix-jdk18on:1.86'
    api 'org.bouncycastle:bctls-jdk18on:1.86'

    testImplementation 'junit:junit:4.13.2'
}

test {
    // Shared Rust/Kotlin wire-format vectors (ProtocolVectorsTest).
    systemProperty 'etph.protocolVectors', file('../../protocol/test-vectors.txt').absolutePath
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}
