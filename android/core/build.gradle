plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.0.21'
    id 'java-library'
    // Mutation testing (weekly CI, .forgejo/workflows/mutation.yml):
    // ./gradlew pitest -> build/reports/pitest/mutations.xml
    id 'info.solidsoft.pitest' version '1.19.0'
}

group = 'com.etphonehome'
version = '0.7.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

kotlin {
    jvmToolchain(17)
}

// PIT version, shared by the pitest {} block and the filter plugin compiled against it.
def pitVersion = '1.22.1'

sourceSets {
    // A PIT plugin (Java, runs inside PIT, never shipped): see the pitest {} block.
    pitFilters
}

dependencies {
    api 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    // TLS 1.3 server with the desktop's token-derived Ed25519 certificate
    // pinning (desktop/common/src/tls/certpin.rs). Android's platform TLS
    // (Conscrypt) cannot use Ed25519 keys, so the app ships Bouncy Castle's
    // JSSE provider (MIT-style Bouncy Castle licence).
    api 'org.bouncycastle:bcprov-jdk18on:1.86'
    api 'org.bouncycastle:bcpkix-jdk18on:1.86'
    api 'org.bouncycastle:bctls-jdk18on:1.86'

    testImplementation 'junit:junit:4.13.2'

    // PIT mutation filter plugin (src/pitFilters), put on PIT's own classpath only.
    pitFiltersCompileOnly "org.pitest:pitest-entry:${pitVersion}"
    pitest sourceSets.pitFilters.output
}

test {
    // Shared Rust/Kotlin wire-format vectors (ProtocolVectorsTest).
    systemProperty 'etph.protocolVectors', file('../../protocol/test-vectors.txt').absolutePath
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}

pitest {
    // Incremental nightly runs (mutation.yml, ci/mutation-incremental.py plan --kind pit) pass the
    // classes changed since the last green run as -PpitChangedClasses=a.B,a.B$*,...; unset = all.
    def pitChanged = project.findProperty('pitChangedClasses')?.toString()?.split(',')?.findAll { it }
    targetClasses = pitChanged ?: ['com.etphonehome.*']
    // explicit: the plugin's default targetTests = targetClasses, which for an incremental run is
    // just the changed classes (no *Test class matches, so every mutant was NO_COVERAGE)
    targetTests = ['com.etphonehome.*']
    failWhenNoMutations = !pitChanged
    // PIT itself; the filter below compiles against this exact version.
    pitestVersion = pitVersion
    // Memory, sized for the 6 GB mutation-x86_64 slot: Gradle daemon (1g, gradle.properties,
    // Kotlin compiles in it) + PIT main process (explicit 1g; unset it takes 1/4 of the
    // container) + 2 minions x 768m = ~3.5g heap. A minion MEMORY_ERROR is a mutant allocating
    // without bound (e.g. a retransmit loop that never advances) and counts as caught, like
    // TIMED_OUT for the mutants that hang (a removed Job.cancel, a loop ignoring cancellation).
    threads = 2
    mainProcessJvmArgs = ['-Xmx1g']
    // Kotlin-aware filtering, both only drop mutants no source edit can produce:
    // - Log calls: the facade only prints (com.etphonehome.log is excluded from the score
    //   floors for the same reason); like PIT's default slf4j/log4j entries, this drops every
    //   mutant on a line that calls it, which here is just the message text.
    // - src/pitFilters (FETPHCOROUTINE): the coroutine state machine kotlinc generates --
    //   removed ResultKt.throwOnFailure resume checks, null for a Unit coroutine result.
    avoidCallsTo = ['java.util.logging', 'org.apache.log4j', 'org.slf4j', 'org.apache.commons.logging',
                    'com.etphonehome.log']
    outputFormats = ['XML', 'HTML']
    timestampedReports = false
    exportLineCoverage = true
    timeoutConstInMillis = 10000
    jvmArgs = ['-Xmx768m', "-Detph.protocolVectors=${file('../../protocol/test-vectors.txt').absolutePath}".toString()]
}

// Mutation testing runs only on the colo host (rw-man-01): rw-man-02..05 are EC2 instances under
// GuardDuty, which flags mutated code as malware. Same check as .forgejo/scripts/ec2-guard.sh, so a
// hand-run `./gradlew pitest` on an EC2 box refuses too (DMI is visible inside containers).
tasks.named('pitest') {
    doFirst {
        def dmi = { String n -> def f = new File("/sys/class/dmi/id/" + n); f.canRead() ? f.text.trim() : '' }
        // Opt-in since 2026-10-18 (all rw-man hosts may run mutation again): only with CI_COLO_ONLY=1.
        boolean coloOnly = System.getenv('CI_COLO_ONLY') == '1'
        boolean ec2 = coloOnly && (dmi('sys_vendor') == 'Amazon EC2' || dmi('board_vendor') == 'Amazon EC2' || dmi('bios_version').contains('amazon'))
        if (coloOnly && !ec2) {
            try {
                def c = (HttpURLConnection) new URL('http://169.254.169.254/latest/meta-data/').openConnection()
                c.connectTimeout = 2000
                c.readTimeout = 2000
                ec2 = c.responseCode in [200, 401]
            } catch (Exception ignored) { }
        }
        if (ec2) {
            throw new GradleException('PIT mutation testing refused: this is an EC2 host; run it on the colo lane (rw-man-01, colo-x86_64)')
        }
    }
}
