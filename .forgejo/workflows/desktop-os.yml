# FreeBSD (and the FreeBSD-based firewalls pfSense CE / OPNsense): cross-
# built on Linux against FreeBSD's own base system, packaged as pkg(8)
# packages (FreeBSD 14 and 15 ABIs, plus the OPNsense plugin os-etph and the
# pfSense package pfSense-pkg-etph), then installed and tested on real VMs
# against the phone core: FreeBSD 14 (Wi-Fi transport, the VM's only way out
# is the phone), OPNsense and pfSense CE (the phone as an assigned interface
# and gateway, a LAN client keeps internet when the primary WAN fails).
#
# macOS and Windows are built and tested natively on the GitHub mirror
# (.github/workflows/desktop-native.yml); the Windows MSI is also built here
# by rust-ci.yml's build-windows job, as released.
name: Desktop FreeBSD

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'android/core/**'
      - 'protocol/**'
      - '.forgejo/scripts/freebsd-cross-env.sh'
      - '.forgejo/scripts/package.sh'
      - '.forgejo/workflows/desktop-os.yml'
      - '.forgejo/scripts/github-native-gate.py'
      - '.github/workflows/desktop-native.yml'
      - 'store/graphics/icon-512.png'
      # .github/workflows/desktop-native.yml has the same paths (gate job).
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

concurrency:
  group: desktop-os-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freebsd:
    name: FreeBSD packages (amd64 + aarch64)
    runs-on: linux-cross-x86_64
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-freebsd,aarch64-unknown-freebsd
          components: clippy
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm xz-utils python3 file
          command -v node || sudo apt-get install -y -qq nodejs
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/freebsd-sysroot
          key: ${{ runner.os }}-${{ runner.arch }}-freebsd-${{ hashFiles('desktop/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-freebsd-
      - name: Build (amd64)
        working-directory: desktop
        run: |
          source ../.forgejo/scripts/freebsd-cross-env.sh amd64
          cargo clippy --release --target "$FREEBSD_TARGET" -p etphonehome-bsd -- -D warnings
          cargo build --release --target "$FREEBSD_TARGET" -p etphonehome-bsd
      - name: Build (aarch64, e.g. Netgate ARM firewalls)
        working-directory: desktop
        run: |
          source ../.forgejo/scripts/freebsd-cross-env.sh arm64
          cargo build --release --target "$FREEBSD_TARGET" -p etphonehome-bsd
      - name: Package
        run: bash .forgejo/scripts/package.sh freebsd "ci-${GITHUB_SHA::8}"
      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: etphonehome-freebsd
          path: |
            dist/*.pkg
            dist/etphonehome-freebsd-*.tar.gz

  freebsd-vm:
    name: Real FreeBSD 14 VM against the phone core
    needs: freebsd
    runs-on: kvm-x86_64
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Keep Node.js on PATH for JS-action steps
        run: |
          command -v node || (sudo apt-get update -qq && sudo apt-get install -y -qq nodejs)
          dirname "$(command -v node)" >> "$GITHUB_PATH"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils xorriso openssh-client xz-utils curl python3
          ls -l /dev/kvm
      - name: Packages
        uses: actions/download-artifact@v3
        with:
          name: etphonehome-freebsd
          path: pkgs
      - name: Build the phone stand-in (android/core)
        working-directory: android/core
        run: |
          for attempt in 1 2 3; do
            ../gradlew --no-daemon --max-workers=2 installDist && break
            [ "$attempt" -eq 3 ] && exit 1
            echo "gradle failed (attempt $attempt/3), retrying in 20s"; sleep 20
          done
      - name: FreeBSD 14.4 VM
        run: |
          PKG=$(ls pkgs/etphonehome-*-freebsd14-amd64.pkg | head -1)
          sudo env "PATH=$PATH" "JAVA_HOME=$JAVA_HOME" python3 desktop/packaging/freebsd/vm-test.py \
            --pkg "$PKG" --standin "$PWD/android/core/standin/build/install/standin" --work /tmp/fbsd-vm
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: freebsd-vm-logs
          path: |
            /tmp/fbsd-vm/serial.log
            /tmp/fbsd-vm/standin-*.log

      - name: Remove the VM work dir (disks, NVRAM, logs already uploaded)
        if: always()
        run: |
          sudo pkill -f "^qemu-system-x86_64 " || true   # this job container only
          sudo rm -rf /tmp/fbsd-vm

  firewall-vms:
    name: Real OPNsense + pfSense CE VMs (plugin/package, phone as gateway, WAN failover)
    needs: freebsd
    runs-on: kvm-x86_64
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Keep Node.js on PATH for JS-action steps
        run: |
          command -v node || (sudo apt-get update -qq && sudo apt-get install -y -qq nodejs)
          dirname "$(command -v node)" >> "$GITHUB_PATH"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils iproute2 iptables dnsmasq-base isc-dhcp-client \
            openssh-client curl bzip2 python3
          ls -l /dev/kvm
      - name: Packages
        uses: actions/download-artifact@v3
        with:
          name: etphonehome-freebsd
          path: pkgs
      - name: Build the phone stand-in (android/core)
        working-directory: android/core
        run: |
          for attempt in 1 2 3; do
            ../gradlew --no-daemon --max-workers=2 installDist && break
            [ "$attempt" -eq 3 ] && exit 1
            echo "gradle failed (attempt $attempt/3), retrying in 20s"; sleep 20
          done
      - name: OPNsense 26.7 (os-etph plugin, FreeBSD 15 client)
        run: |
          sudo env "PATH=$PATH" "JAVA_HOME=$JAVA_HOME" python3 desktop/packaging/firewall-vm/opnsense-vm-test.py \
            --release 26.7 --pkgdir "$PWD/pkgs" --standin "$PWD/android/core/standin/build/install/standin" --work /tmp/opn-vm
      - name: pfSense CE 2.7.2 (pfSense-pkg-etph, FreeBSD 14 client)
        if: always()
        run: |
          sudo env "PATH=$PATH" "JAVA_HOME=$JAVA_HOME" python3 desktop/packaging/firewall-vm/pfsense-vm-test.py \
            --pkgdir "$PWD/pkgs" --standin "$PWD/android/core/standin/build/install/standin" --work /tmp/pf-vm
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: firewall-vm-logs
          path: |
            /tmp/opn-vm/serial-*.log
            /tmp/opn-vm/standin-*.log
            /tmp/pf-vm/serial-*.log
            /tmp/pf-vm/standin-*.log

      - name: Remove the VM work dirs (disks, NVRAM, logs already uploaded)
        if: always()
        run: |
          sudo pkill -f "^qemu-system-x86_64 " || true   # this job container only
          sudo rm -rf /tmp/opn-vm /tmp/pf-vm

  native-macos-windows:
    name: macOS (Apple silicon, macOS 26+) and Windows e2e, on the GitHub mirror
    # Runs desktop/packaging/macos/e2e.sh and desktop/packaging/windows/e2e.ps1
    # on GitHub-hosted Macs and Windows (.github/workflows/desktop-native.yml)
    # and reports their result here.
    runs-on: linux-any  # arch-independent: arm64 or x86 slot, whichever is free (ctg-infrastructure ci-runners)
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the native run and check it
        run: python3 .forgejo/scripts/github-native-gate.py "$GITHUB_SHA"
