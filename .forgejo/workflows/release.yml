name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux Release
    runs-on: linux-cross-x86_64
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Build release (glibc 2.31 baseline, static libdbus)
        run: bash .forgejo/scripts/build-linux-release.sh etphonehome-linux etphonehome
      - name: Package
        # Same script the per-push Rust CI build job runs, so this path is
        # exercised on every push (it used to strip/tar a nonexistent
        # `etphonehome-linux` file and fail).
        run: bash .forgejo/scripts/package.sh linux "${{ github.ref_name }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: etphonehome-linux-${{ github.ref_name }}
          path: dist/etphonehome-linux-${{ github.ref_name }}.tar.gz

  build-windows:
    name: Build Windows Release
    # No windows-latest runner exists in this infra — cross-compile via
    # mingw-w64 on the real x86_64 runner (same fix as rust-ci.yml).
    runs-on: linux-cross-x86_64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install mingw-w64 and zip
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 zip unzip
      - name: Build release
        working-directory: desktop
        run: cargo build --release -p etphonehome-windows --target x86_64-pc-windows-gnu
      - name: Package
        run: bash .forgejo/scripts/package.sh windows "${{ github.ref_name }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: etphonehome-windows-${{ github.ref_name }}
          path: dist/etphonehome-windows-${{ github.ref_name }}.zip

  build-gui-linux:
    name: Build Desktop GUI (Linux)
    # Previously the GUI crate (etphonehome-gui) was never packaged into a
    # release at all -- only the CLI binaries (etphonehome-linux,
    # etphonehome-windows) shipped, even though the GUI is a real, actively
    # maintained feature (part of the v0.5.0 "GUI, TLS, filtering, root mode"
    # release and still getting bugfixes). Ship it like the CLI.
    runs-on: linux-cross-x86_64
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Build release (glibc 2.31 baseline)
        run: bash .forgejo/scripts/build-linux-release.sh etphonehome-gui etphonehome-gui
      - name: Package
        run: bash .forgejo/scripts/package.sh gui "${{ github.ref_name }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: etphonehome-gui-${{ github.ref_name }}
          path: dist/etphonehome-gui-${{ github.ref_name }}.tar.gz

  build-openwrt:
    name: Build OpenWrt router packages
    # Same script as openwrt.yml (which also VM-tests them on every change).
    runs-on: linux-cross-x86_64
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y file xz-utils python3
      - name: Build binaries and packages
        run: bash .forgejo/scripts/openwrt-packages.sh "${GITHUB_REF_NAME#v}" "dist/openwrt" "$PWD/openwrt-bin"
      - name: Drop the VM-test file list
        run: rm -f dist/openwrt/index.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: openwrt-packages-${{ github.ref_name }}
          path: dist/openwrt/

  build-android:
    name: Build Android Release
    runs-on: linux-cross-x86_64
    timeout-minutes: 30
    outputs:
      sha256: ${{ steps.out.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      # (gradle/actions/setup-gradle@v3 removed: it fails on this runner with
      # "node: executable file not found", see android-ci.yml.)
      - name: Set up Android SDK
        run: .forgejo/scripts/setup-android-sdk.sh
      # UNSIGNED here (no secrets on build runners); sign-android signs it with the ETPH release
      # key on the dedicated signer. Before 0.7.0 the release APK carried the committed debug key.
      - name: Build UNSIGNED release APK
        working-directory: android
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          export PATH="$PATH:$ANDROID_HOME/platform-tools"
          test ! -e keystore.properties
          ./gradlew assembleRelease -PunsignedRelease=true --max-workers=2
      - name: Checksum
        id: out
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release-unsigned.apk
          unzip -l "$APK" > list.txt; grep -q AndroidManifest.xml list.txt
          echo "sha256=$(sha256sum "$APK" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          sha256sum "$APK"
      - name: Upload unsigned APK for the signer
        uses: actions/upload-artifact@v3
        with:
          name: android-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 3

  create-release:
    name: Publish Forgejo release
    # softprops/action-gh-release only speaks GitHub's API, so no release was
    # ever created here. This talks to the Forgejo releases API directly:
    # create (or reuse) the release for the tag, upload every package, then
    # verify the release really lists all four.
    needs: [build-linux, build-windows, build-gui-linux, build-android, build-openwrt]
    runs-on: linux-cross-x86_64
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the versions the packages carry
        run: |
          TAG="${{ github.ref_name }}"
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' desktop/Cargo.toml | head -1)
          APK=$(sed -n 's/.*versionName "\(.*\)"/\1/p' android/app/build.gradle | head -1)
          echo "tag=$TAG cargo=$CARGO android=$APK"
          test "$TAG" = "v$CARGO"
          test "$TAG" = "v$APK"
          grep -q "## \[$CARGO\]" CHANGELOG.md
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts
      - name: Create release and upload packages
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VER=${TAG#v}
          # Release notes = this version's CHANGELOG section.
          awk -v v="$VER" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          PRE=false
          case "$TAG" in *alpha*|*beta*|*rc*) PRE=true ;; esac
          BODY=$(python3 -c 'import json,sys; print(json.dumps({"tag_name": sys.argv[1], "name": "ET Phone Home " + sys.argv[1], "body": open("notes.md").read(), "draft": False, "prerelease": sys.argv[2] == "true"}))' "$TAG" "$PRE")
          auth=(-H "Authorization: token $TOKEN")
          CODE=$(curl -sS -o rel.json -w '%{http_code}' "${auth[@]}" -H 'Content-Type: application/json' -X POST "$API/releases" -d "$BODY")
          if [ "$CODE" != 201 ]; then
            echo "create returned $CODE: $(cat rel.json)"
            curl -fsS "${auth[@]}" "$API/releases/tags/$TAG" -o rel.json
          fi
          ID=$(python3 -c 'import json; print(json.load(open("rel.json"))["id"])')
          echo "release id $ID"
          # The APK is signed and uploaded by sign-android, never the unsigned build.
          rm -rf artifacts/android-unsigned-apk
          for f in artifacts/*/*; do
            name=$(basename "$f")
            # Re-runs replace an asset of the same name.
            OLD=$(curl -fsS "${auth[@]}" "$API/releases/$ID/assets" | python3 -c 'import json,sys; n=sys.argv[1]; print(" ".join(str(a["id"]) for a in json.load(sys.stdin) if a["name"]==n))' "$name")
            for a in $OLD; do curl -fsS "${auth[@]}" -X DELETE "$API/releases/$ID/assets/$a"; done
            echo "uploading $name ($(stat -c %s "$f") bytes)"
            # Forgejo stores attachments on Backblaze B2, which intermittently drops a PUT
            # ("ContentLength=N with Body length 0" -> HTTP 500). Retry; clear a partial
            # asset of the same name before each new attempt.
            ok=0
            for try in 1 2 3 4 5 6; do
              if curl -fsS "${auth[@]}" -X POST "$API/releases/$ID/assets?name=$name" -F "attachment=@$f" >/dev/null; then ok=1; break; fi
              echo "upload of $name failed (attempt $try); retrying in $((try*20))s"
              sleep $((try*20))
              for a in $(curl -fsS "${auth[@]}" "$API/releases/$ID/assets" | python3 -c 'import json,sys; n=sys.argv[1]; print(" ".join(str(a["id"]) for a in json.load(sys.stdin) if a["name"]==n))' "$name"); do curl -fsS "${auth[@]}" -X DELETE "$API/releases/$ID/assets/$a" || true; done
            done
            [ "$ok" = 1 ] || { echo "giving up on $name"; exit 1; }
          done

  sign-android:
    name: Sign the APK with the ETPH release key and attach it
    needs: [build-android, create-release]
    runs-on: etphonehome-release-signer
    timeout-minutes: 20
    steps:
      - name: Fetch this commit (plain git, no actions; runs on the dedicated signer)
        env:
          REPO_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader
          GIT_CONFIG_VALUE_0="Authorization: basic $(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          git fetch -q --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -q --force FETCH_HEAD
      - name: Verify checksum, sign, verify signer cert
        env:
          EXPECTED_SHA256: ${{ needs.build-android.outputs.sha256 }}
          REPO_TOKEN: ${{ github.token }}
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_STORE_PASSWORD }}
          RELEASE_KEYSTORE_KEY_ALIAS: ${{ secrets.RELEASE_KEYSTORE_KEY_ALIAS }}
          RELEASE_KEYSTORE_KEY_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_KEY_PASSWORD }}
        run: |
          mkdir -p dist
          .forgejo/scripts/sign-apk.sh "dist/etphonehome-${{ github.ref_name }}.apk"
      - name: Attach the signed APK to the release
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          trap 'rm -rf dist' EXIT
          f="dist/etphonehome-$TAG.apk"; name=$(basename "$f")
          auth=(-H "Authorization: token $TOKEN")
          ID=$(curl -fsS "${auth[@]}" "$API/releases/tags/$TAG" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          ok=0
          for try in 1 2 3 4 5 6; do
            for a in $(curl -fsS "${auth[@]}" "$API/releases/$ID/assets" | python3 -c 'import json,sys; n=sys.argv[1]; print(" ".join(str(a["id"]) for a in json.load(sys.stdin) if a["name"]==n))' "$name"); do
              curl -fsS "${auth[@]}" -X DELETE "$API/releases/$ID/assets/$a" || true
            done
            if curl -fsS "${auth[@]}" -X POST "$API/releases/$ID/assets?name=$name" -F "attachment=@$f" >/dev/null; then ok=1; break; fi
            echo "upload of $name failed (attempt $try); retrying in $((try*20))s"; sleep $((try*20))
          done
          [ "$ok" = 1 ] || { echo "giving up on $name"; exit 1; }
          echo "attached $name ($(sha256sum "$f" | awk '{print $1}'))"

  verify-release:
    name: Verify the published release
    needs: sign-android
    runs-on: linux-cross-x86_64
    timeout-minutes: 10
    steps:
      - name: Verify the published release
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          curl -fsS -H "Authorization: token $TOKEN" "$API/releases/tags/$TAG" | python3 -c '
          import json, sys
          r = json.load(sys.stdin)
          names = sorted(a["name"] for a in r["assets"])
          print(r["html_url"]); print("\n".join(names))
          tag = r["tag_name"]
          v = tag[1:] + "-r1"
          want = {f"etphonehome-linux-{tag}.tar.gz", f"etphonehome-windows-{tag}.zip", f"etphonehome-gui-{tag}.tar.gz", f"etphonehome-{tag}.apk",
                  "etph-openwrt-install.sh", "SHA256SUMS", "sizes.tsv", f"luci-app-etph_{v}_all.ipk", f"luci-app-etph-{v}_noarch.apk"}
          for arch in ("x86_64", "aarch64_cortex-a53", "arm_cortex-a7_neon-vfpv4", "mips_24kc", "mipsel_24kc"):
              want |= {f"etph_{v}_{arch}.ipk", f"etph-{v}_{arch}.apk"}
          missing = want - set(names)
          assert not missing, f"missing assets: {missing}"
          assert not r["draft"], "release is a draft"
          '
