# Gradle settings when android/core is built on its own (CI: PIT mutation job, e2e stand-in).
# Inside the app build (android/settings.gradle includeBuild) android/gradle.properties applies.
# Kotlin compiles inside the Gradle daemon instead of a separate Kotlin daemon that would stay
# up next to PIT with its own heap (mutation-x86_64 slots have 6 GB; budget in build.gradle).
org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
