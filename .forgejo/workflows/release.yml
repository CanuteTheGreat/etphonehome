name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux Release
    runs-on: x86_64
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Build release
        working-directory: desktop
        run: cargo build --release -p etphonehome-linux
      - name: Strip binary
        run: strip desktop/target/release/etphonehome-linux
      - name: Create tarball
        run: |
          cd desktop/target/release
          tar -czvf etphonehome-linux-${{ github.ref_name }}.tar.gz etphonehome-linux
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: etphonehome-linux-${{ github.ref_name }}
          path: desktop/target/release/etphonehome-linux-${{ github.ref_name }}.tar.gz

  build-windows:
    name: Build Windows Release
    # No windows-latest runner exists in this infra — cross-compile via
    # mingw-w64 on the real x86_64 runner (same fix as rust-ci.yml).
    runs-on: x86_64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install mingw-w64 and zip
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 zip
      - name: Build release
        working-directory: desktop
        run: cargo build --release -p etphonehome-windows --target x86_64-pc-windows-gnu
      - name: Create zip
        run: |
          cd desktop/target/x86_64-pc-windows-gnu/release
          zip etphonehome-windows-${{ github.ref_name }}.zip etphonehome-windows.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: etphonehome-windows-${{ github.ref_name }}
          path: desktop/target/x86_64-pc-windows-gnu/release/etphonehome-windows-${{ github.ref_name }}.zip

  build-gui-linux:
    name: Build Desktop GUI (Linux)
    # Previously the GUI crate (etphonehome-gui) was never packaged into a
    # release at all -- only the CLI binaries (etphonehome-linux,
    # etphonehome-windows) shipped, even though the GUI is a real, actively
    # maintained feature (part of the v0.5.0 "GUI, TLS, filtering, root mode"
    # release and still getting bugfixes). Ship it like the CLI.
    runs-on: x86_64
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Build release
        working-directory: desktop
        run: cargo build --release -p etphonehome-gui
      - name: Strip binary
        run: strip desktop/target/release/etphonehome-gui
      - name: Create tarball
        run: |
          cd desktop/target/release
          tar -czvf etphonehome-gui-${{ github.ref_name }}.tar.gz etphonehome-gui
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: etphonehome-gui-${{ github.ref_name }}
          path: desktop/target/release/etphonehome-gui-${{ github.ref_name }}.tar.gz

  build-android:
    name: Build Android Release
    runs-on: x86_64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Set up Android SDK
        run: .forgejo/scripts/setup-android-sdk.sh
      - name: Build release APK
        working-directory: android
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          export PATH="$PATH:$ANDROID_HOME/platform-tools"
          ./gradlew assembleRelease
      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/release/app-release-unsigned.apk \
             android/app/build/outputs/apk/release/etphonehome-${{ github.ref_name }}.apk
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: etphonehome-android-${{ github.ref_name }}
          path: android/app/build/outputs/apk/release/etphonehome-${{ github.ref_name }}.apk

  create-release:
    name: Create Release
    needs: [build-linux, build-windows, build-gui-linux, build-android]
    runs-on: x86_64
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: ET Phone Home ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          generate_release_notes: true
          files: |
            artifacts/etphonehome-linux-${{ github.ref_name }}/*.tar.gz
            artifacts/etphonehome-windows-${{ github.ref_name }}/*.zip
            artifacts/etphonehome-gui-${{ github.ref_name }}/*.tar.gz
            artifacts/etphonehome-android-${{ github.ref_name }}/*.apk
