[package]
name = "etphonehome-common"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
tun = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
ring = { workspace = true }
rcgen = { workspace = true }
mdns-sd = { workspace = true }
clap = { workspace = true }
env_logger = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", features = ["bluetoothd", "rfcomm"] }
futures = "0.3"
# Build libdbus (bluer's D-Bus transport) from source and link it statically:
# the release binary then needs no libdbus-1.so on the user's machine and
# can be linked against an old glibc (.forgejo/scripts/build-linux-release.sh)
# so it runs on every distro we claim, not just ones as new as the CI image.
libdbus-sys = { version = "0.2", features = ["vendored"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lib]
name = "etphonehome_common"
path = "src/lib.rs"
