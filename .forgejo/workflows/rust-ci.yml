name: Rust CI

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.forgejo/workflows/rust-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.forgejo/workflows/rust-ci.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format Check
    runs-on: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        working-directory: desktop
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libdbus-1-dev pkg-config
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('desktop/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-
      - name: Run clippy
        working-directory: desktop
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libdbus-1-dev pkg-config
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('desktop/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
      - name: Run tests
        working-directory: desktop
        run: cargo test --all

  build-linux:
    name: Build Linux
    runs-on: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libdbus-1-dev pkg-config
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('desktop/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-
      - name: Build release
        working-directory: desktop
        run: cargo build --release -p etphonehome-linux
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: etphonehome-linux
          path: desktop/target/release/etphonehome-linux

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('desktop/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-
      - name: Build release
        working-directory: desktop
        run: cargo build --release -p etphonehome-windows
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: etphonehome-windows
          path: desktop/target/release/etphonehome-windows.exe
