name: Rust CI

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'protocol/**'
      - 'android/core/**'
      - 'android/app/src/main/java/com/etphonehome/service/TetherService.kt'
      - 'scripts/quick-start-linux.sh'
      - '.forgejo/scripts/desktop-e2e*.sh'
      - '.forgejo/scripts/e2e-lib.sh'
      - '.forgejo/scripts/e2e-target-services.py'
      - '.forgejo/scripts/package.sh'
      - '.forgejo/scripts/build-linux-release.sh'
      - '.forgejo/workflows/rust-ci.yml'
      - '.forgejo/scripts/ci-rust-env.sh'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'protocol/**'
      - 'android/core/**'
      - 'android/app/src/main/java/com/etphonehome/service/TetherService.kt'
      - 'scripts/quick-start-linux.sh'
      - '.forgejo/scripts/desktop-e2e*.sh'
      - '.forgejo/scripts/e2e-lib.sh'
      - '.forgejo/scripts/e2e-target-services.py'
      - '.forgejo/scripts/package.sh'
      - '.forgejo/scripts/build-linux-release.sh'
      - '.forgejo/workflows/rust-ci.yml'
      - '.forgejo/scripts/ci-rust-env.sh'

env:
  CARGO_TERM_COLOR: always
  # Incremental state is never reused in CI; it only costs memory and disk.
  CARGO_INCREMENTAL: 0

# Concurrency (2026-10-17, ctg-infrastructure ollivanders/forgejo/ci-supersede-sweeper):
# other branches and PRs: a new push cancels the older run. main: runs queue behind each
# other instead, so a run that has started is never cancelled by a later push, and the
# sweeper cancels superseded runs that never started (keeps the newest, plus the oldest
# while nothing in the group runs, so constant pushes can't keep main at the back of
# the shared runner queue). Forgejo 17 ignores jobs.<id>.concurrency; only this block counts.
concurrency:
  group: "latest:${{ github.workflow }}@${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  fmt:
    name: Format Check
    runs-on: linux-any  # arch-independent: arm64 or x86 slot, whichever is free (ctg-infrastructure ci-runners)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        working-directory: desktop
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: fmt
    runs-on: linux-any  # arch-independent: arm64 or x86 slot, whichever is free (ctg-infrastructure ci-runners)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libdbus-1-dev pkg-config
      - name: Ensure Node.js is present (self-heal)
        run: command -v node || sudo apt-get install -y nodejs
      - name: Build env (mold linker, no incremental)
        # .forgejo/scripts/ci-rust-env.sh: pinned, sha256-checked mold as the
        # linker for the following steps (no sccache: no persistent cache
        # volume in a job container). Not used where cargo-zigbuild links.
        run: CI_NO_SCCACHE=1 CI_RUST_ENV_EXPORT=1 . .forgejo/scripts/ci-rust-env.sh
      - name: Compute cache key
        id: cachekey
        run: echo "hash=$(find desktop -name Cargo.toml | sort | xargs cat | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-clippy-${{ steps.cachekey.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-clippy-
      - name: Run clippy
        working-directory: desktop
        run: cargo clippy --all-targets --all-features -- -D warnings

  audit:
    name: Security Audit
    needs: fmt
    runs-on: linux-any  # arch-independent: arm64 or x86 slot, whichever is free (ctg-infrastructure ci-runners)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libdbus-1-dev pkg-config
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Generate Cargo.lock
        # Cargo.lock is gitignored and never committed in this workspace, so
        # a fresh checkout has nothing for cargo-audit to scan (it errors
        # with "Couldn't load Cargo.lock" rather than silently passing).
        working-directory: desktop
        run: cargo generate-lockfile
      - name: Run cargo audit
        working-directory: desktop
        run: cargo audit

  test:
    name: Test
    needs: [clippy, audit]
    runs-on: linux-any  # arch-independent: arm64 or x86 slot, whichever is free (ctg-infrastructure ci-runners)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libdbus-1-dev pkg-config
      - name: Ensure Node.js is present (self-heal)
        run: command -v node || sudo apt-get install -y nodejs
      - name: Build env (mold linker, no incremental)
        # .forgejo/scripts/ci-rust-env.sh: pinned, sha256-checked mold as the
        # linker for the following steps (no sccache: no persistent cache
        # volume in a job container). Not used where cargo-zigbuild links.
        run: CI_NO_SCCACHE=1 CI_RUST_ENV_EXPORT=1 . .forgejo/scripts/ci-rust-env.sh
      - name: Compute cache key
        id: cachekey
        run: echo "hash=$(find desktop -name Cargo.toml | sort | xargs cat | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-test-${{ steps.cachekey.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-test-
      - name: Run tests
        working-directory: desktop
        # --no-fail-fast so one failing crate can't hide the others' results.
        run: cargo test --all --no-fail-fast

  e2e:
    name: End-to-end (real client + TUN + phone core, real internet)
    # The release `etphonehome` binary on a real TUN device, in a container
    # whose only way out is the tunnel, against the Android app's own
    # networking core (android/core, run as the plain-JVM `standin`):
    # handshake, cert-pinned TLS (default for WiFi), the userspace relay and
    # the traffic filter. Proves real internet through the phone -- public
    # HTTPS + HTTP, DNS, 5 MiB TCP, TCP echo, UDP, ICMP, 20 parallel
    # connections -- plus USB via an adb shim, profile filter rules sent to
    # and enforced by the phone, wrong tokens, plaintext refusal,
    # auto-reconnect and Ctrl-C disconnect. See .forgejo/scripts/desktop-e2e.sh.
    needs: [clippy]
    runs-on: linux-cross-x86_64
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libdbus-1-dev pkg-config
      - name: Ensure Node.js is present (self-heal)
        run: command -v node || sudo apt-get install -y nodejs
      - name: Compute cache key
        id: cachekey
        run: echo "hash=$(find desktop -name Cargo.toml | sort | xargs cat | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-e2e-${{ steps.cachekey.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-e2e-
      - name: Build client (exactly as released) and privileged tests
        run: |
          bash .forgejo/scripts/build-linux-release.sh etphonehome-linux etphonehome
          cd desktop
          T=$(cargo test -p etphonehome-common --no-run 2>&1 | grep -o 'target/debug/deps/etphonehome_common-[a-z0-9]*' | head -1)
          test -n "$T"
          mkdir -p ../e2e-bin
          cp target/release/etphonehome ../e2e-bin/
          cp "$T" ../e2e-bin/common-tests
      - name: Build the phone stand-in (android/core)
        working-directory: android/core
        run: |
          for attempt in 1 2 3; do
            ../gradlew --no-daemon --max-workers=2 installDist && break
            [ "$attempt" -eq 3 ] && exit 1
            echo "gradle failed (attempt $attempt/3, usually a Maven Central blip), retrying in 20s"; sleep 20
          done
          test -x standin/build/install/standin/bin/standin
      - name: Run end-to-end scenarios
        run: bash .forgejo/scripts/desktop-e2e.sh "$PWD/e2e-bin" "$PWD/android/core/standin/build/install/standin"

  build-linux:
    name: Build Linux
    needs: test
    runs-on: linux-cross-x86_64
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libdbus-1-dev pkg-config
      - name: Ensure Node.js is present (self-heal)
        run: command -v node || sudo apt-get install -y nodejs
      - name: Compute cache key
        id: cachekey
        run: echo "hash=$(find desktop -name Cargo.toml | sort | xargs cat | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-build-${{ steps.cachekey.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-build-
      - name: Build release (glibc 2.31 baseline, static libdbus -- as released)
        run: bash .forgejo/scripts/build-linux-release.sh etphonehome-linux etphonehome
      - name: Package (same script as release.yml) and smoke-test
        run: bash .forgejo/scripts/package.sh linux "ci-${GITHUB_SHA::8}"
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: etphonehome-linux
          # The binary is `etphonehome`; this used to point at a
          # nonexistent `etphonehome-linux`, so nothing was ever uploaded.
          path: dist/etphonehome-linux-*.tar.gz

  build-windows:
    name: Build Windows
    needs: build-linux
    # No windows-latest (or any Windows) runner is registered in this infra —
    # that label silently never picks up a job (stuck "Waiting to run"
    # forever). Cross-compile to Windows via mingw-w64 on the real x86_64
    # runner instead of depending on a nonexistent Windows box.
    runs-on: linux-cross-x86_64
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 zip unzip
      - name: Ensure Node.js is present (self-heal)
        run: command -v node || sudo apt-get install -y nodejs
      - name: Compute cache key
        id: cachekey
        run: echo "hash=$(find desktop -name Cargo.toml | sort | xargs cat | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-build-windows-${{ steps.cachekey.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-build-windows-
      - name: Build release
        working-directory: desktop
        run: cargo build --release -p etphonehome-windows --target x86_64-pc-windows-gnu
      - name: Package (same script as release.yml)
        run: bash .forgejo/scripts/package.sh windows "ci-${GITHUB_SHA::8}"
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: etphonehome-windows
          # Binary is etphonehome.exe (was pointed at etphonehome-windows.exe).
          path: dist/etphonehome-windows-*.zip

  build-gui:
    name: Build Desktop GUI
    # The GUI crate (desktop/gui, etphonehome-gui) was only ever compiled
    # incidentally as part of `cargo test --all` in the `test` job above --
    # ET Phone Home has shipped a real, actively-developed GUI (iced-based,
    # with its own view/profile/filter-rule editing code and bugfix commits)
    # since the v0.5.0 release, but no CI job ever built it as a standalone
    # binary the way the CLI (etphonehome-linux/etphonehome-windows) gets
    # built here. Add the missing build so a broken GUI-only compile is
    # caught the same way a broken CLI compile would be.
    needs: test
    runs-on: linux-cross-x86_64
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libdbus-1-dev pkg-config
      - name: Ensure Node.js is present (self-heal)
        run: command -v node || sudo apt-get install -y nodejs
      - name: Compute cache key
        id: cachekey
        run: echo "hash=$(find desktop -name Cargo.toml | sort | xargs cat | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-build-gui-${{ steps.cachekey.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-build-gui-
      - name: Build release (glibc 2.31 baseline -- as released)
        run: bash .forgejo/scripts/build-linux-release.sh etphonehome-gui etphonehome-gui
      - name: Package (same script as release.yml)
        run: bash .forgejo/scripts/package.sh gui "ci-${GITHUB_SHA::8}"
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: etphonehome-gui
          path: dist/etphonehome-gui-*.tar.gz
